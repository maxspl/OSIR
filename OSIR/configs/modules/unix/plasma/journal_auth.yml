metadata:
  version: "1.0"
  author: maxspl
  description: Authentication events from the systemd journal (replaces auth.log on systemd-only hosts)
  os: unix

configuration:
  module: journal_auth
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  dissector: linux_journal_auth

splunk:
  'linux:journal_auth':
    name_rex: r"\.jsonl$"
    path_suffix: journal_auth
    sourcetype: 'linux:journal_auth'
    host_rex: r"([\w\.-]+?)--"
    timestamp_path:
        - "journal_time"
    timestamp_format: "%Y-%m-%dT%H:%M:%S.%f%z"
    artifact: "journal_auth"
