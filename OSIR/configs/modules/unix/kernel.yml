metadata:
  version: "2.0"
  author: Typ
  description: Parsing logs from '/var/log/kernel'
  os: unix

configuration:
  module: kernel
  type: process
  disk_only: true
  no_multithread: true
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  name: (?:kern\.log|kernel)
  path: var/log/

output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:kernel':
    name_rex: r"\.jsonl$"
    path_suffix: kernel
    sourcetype: 'linux:kernel'
    host_rex: r"([\w\.-]+?)--"
    timestamp_path: 
        - "_time"
    timestamp_format: "%Y-%m-%dT%H:%M:%S"
    artifact: "kernel"
