metadata:
  version: "1.0"
  author: maxspl
  description: XDG autostart entries, a known persistence location
  os: unix

configuration:
  module: xdg_autostart
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  dissector: linux_xdg_autostart

splunk:
  'linux:xdg_autostart':
    name_rex: r"\.jsonl$"
    path_suffix: xdg_autostart
    sourcetype: 'linux:xdg_autostart'
    host_rex: r"([\w\.-]+?)--"
    artifact: "xdg_autostart"
