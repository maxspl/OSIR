metadata:
  version: "1.0"
  author: maxspl
  description: Kernel and platform identification from uname -a
  os: unix

configuration:
  module: uname
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --uname | jq -c '.' > {output_file}"

input:
  type: file
  paths:
    - r"\/uname_-a\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/system"
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:live_response:system:uname':
    name_rex: --uname-.*\.jsonl$
    path_suffix: system
    sourcetype: 'linux:live_response:system:uname'
    host_rex: ([\w\.-]+?)--
    artifact: uname
