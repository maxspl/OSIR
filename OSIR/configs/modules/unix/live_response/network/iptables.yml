metadata:
  version: "2.0"
  author: Kelly Brazil
  description: Kelly Brazil - JsonConverter - Parsing the output of the command iptables
  os: unix

configuration:
  module: iptables
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool: 
  path: cat
  cmd: "{input_file} | jc --iptables | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/iptables\.txt$"
    - r"\/iptables_-.*\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/network"
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:live_response:network:iptables':
    name_rex: r"iptables.*\.jsonl$"
    path_suffix: network
    sourcetype: 'linux:live_response:network:iptables'
    host_rex: r"([\w\.-]+?)--"
    artifact: iptables
