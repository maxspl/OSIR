metadata:
  version: "2.0"
  author: Typ
  description: Parsing logs from '/var/log/syslog'
  os: unix

configuration:
  module: syslog
  type: process
  disk_only: true
  no_multithread: true
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  name: (?:syslog)
  path: var/log

output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:syslog':
    name_rex: r"syslog.*\.jsonl$"
    sourcetype: 'linux:syslog'
    host_rex: r"([\w\.-]+?)--"
    timestamp_path: 
    - "_time"
    timestamp_format: "%Y-%m-%dT%H:%M:%S"
    artifact: "syslog"
