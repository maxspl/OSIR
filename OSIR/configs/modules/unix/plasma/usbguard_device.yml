metadata:
  version: "1.0"
  author: maxspl
  description: usbguard device events
  os: unix

configuration:
  module: usbguard_device
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_usbguard_device

splunk:
  'linux:usbguard_device':
    name_rex: \.jsonl$
    path_suffix: usbguard_device
    sourcetype: 'linux:usbguard_device'
    host_rex: ([\w\.-]+?)--
    timestamp_path:
        - "usbguard_timestamp"
    artifact: "usbguard_device"
