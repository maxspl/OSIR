metadata:
  version: "1.0"
  author: maxspl
  description: Password ageing metadata from /etc/shadow
  os: unix

configuration:
  module: shadow
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_shadow

splunk:
  'linux:shadow':
    name_rex: \.jsonl$
    path_suffix: shadow
    sourcetype: 'linux:shadow'
    host_rex: ([\w\.-]+?)--
    artifact: "shadow"
