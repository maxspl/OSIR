metadata:
  version: "1.0"
  id: hayabusa
  author: Typ
  description: 'HAYABUSA COMMON MAPPING #'

transformation:
  - set:
      event.original: encode_json!(.)
    conditions:
      - field: event.original
        exists: false

  # Timestamp: parse + reformat pipeline with an intermediate value.
  - custom: |2-
      if exists(.Timestamp) {
          ts = to_string!(del(.Timestamp))
          parsed_ts = parse_timestamp!(ts, format: "%Y-%m-%d %H:%M:%S%.f %:z")
          .timestamp = format_timestamp!(parsed_ts, format: "%Y-%m-%dT%H:%M:%SZ")
      }

  - set:
      event.kind:
        value: event
      event.module:
        value: hayabusa
      agent.type:
        value: hayabusa

  - set:
      rule.name: del(.RuleTitle)
  - set:
      event.reason: .rule.name

  - set:
      log.level: downcase(string!(.Level))
      hayabusa.level: downcase(string!(.Level))
  - delete:
      - Level
  - set:
      event.severity:
        value: 90
    filter: '.log.level == "crit" || .log.level == "critical"'
  - set:
      event.severity:
        value: 75
    conditions:
      - field: log.level
        value: high
  - set:
      event.severity:
        value: 50
    filter: '.log.level == "med" || .log.level == "medium"'
  - set:
      event.severity:
        value: 25
    conditions:
      - field: log.level
        value: low

  - set:
      host.name: del(.Computer)

  - set:
      hayabusa.channel: .Channel
      winlog.channel: .Channel
      channel_lower: downcase(string!(.Channel))
  - delete:
      - Channel
  - set:
      event.dataset:
        value: windows.security
    conditions:
      - field: channel_lower
        value: sec
  - set:
      event.dataset:
        value: windows.system
    conditions:
      - field: channel_lower
        value: sys
  - set:
      event.dataset:
        value: windows.defender
    conditions:
      - field: channel_lower
        value: defender
  - set:
      event.dataset: '"hayabusa." + string!(.channel_lower)'
    filter: '!exists(.event.dataset) && exists(.channel_lower)'
  - delete:
      - channel_lower

  - set:
      event.code: to_string!(.EventID)
      winlog.event_id: to_string!(.EventID)
  - delete:
      - EventID

  - set:
      winlog.record_id: to_string!(del(.RecordID))
      hayabusa.details: del(.Details)
      hayabusa.extra: del(.ExtraFieldInfo)

  # hayabusa extra/details -> ECS (each entry is guarded by exists() on its source)
  - set:
      user.name: .hayabusa.extra.SubjectUserName
      user.domain: .hayabusa.extra.SubjectDomainName
      user.id: .hayabusa.extra.SubjectUserSid
      winlog.subject.logon_id: .hayabusa.extra.SubjectLogonId
      user.target.domain: .hayabusa.extra.TargetDomainName
      source.domain: .hayabusa.details.SrcComp
      source.ip: .hayabusa.details.SrcIP
      source.port: to_string!(.hayabusa.extra.IpPort)
      winlog.logon.authentication_package: .hayabusa.details.AuthPkg
      winlog.logon.type: .hayabusa.details.Type
      winlog.logon.process.name: .hayabusa.extra.LogonProcessName
      winlog.logon.key_length: .hayabusa.extra.KeyLength
      process.executable: .hayabusa.details.Path
      file.path: .hayabusa.details.Path
      file.name: basename!(.hayabusa.details.Path)
      service.display_name: .hayabusa.details.Svc
      service.account: .hayabusa.details.Acct
      service.start_type: .hayabusa.details.StartType
      service.type: .hayabusa.extra.ServiceType
      observer.product: '.hayabusa.extra."Product Name"'
      observer.version: '.hayabusa.extra."Product Version"'
      error.message: .hayabusa.extra.FailureReason
      winlog.status: .hayabusa.extra.Status
      winlog.sub_status: .hayabusa.extra.SubStatus

  # ordered overrides: the second source wins when both exist
  - set:
      user.target.name: .hayabusa.details.TgtUser
  - set:
      user.target.name: .hayabusa.extra.TargetUserName
  - set:
      user.target.id: .hayabusa.extra.TargetUserSid
  - set:
      user.target.id: .hayabusa.extra.TargetSid
  - set:
      process.executable: .hayabusa.details.Proc
    filter: 'exists(.hayabusa.details.Proc) && .hayabusa.details.Proc != "-"'
  - set:
      process.pid: 'to_int(.hayabusa.extra.ProcessId) ?? null'
    filter: '(to_int(.hayabusa.extra.ProcessId) ?? 0) != 0'

  # event-code categorization
  - set:
      event.category:
        value: [authentication]
      event.type:
        value: [start, denied]
      event.action:
        value: logon_failed
      event.outcome:
        value: failure
    conditions:
      - field: event.code
        value: '4625'
  - set:
      related.ip: '[.source.ip]'
    conditions:
      - field: event.code
        value: '4625'
  - set:
      user.name: .user.target.name
    conditions:
      - field: event.code
        value: '4625'
      - field: user.name
        exists: false
  - set:
      related.user: '[.user.name]'
    conditions:
      - field: event.code
        value: '4625'

  - set:
      event.category:
        value: [iam]
      event.type:
        value: [change]
      event.action:
        value: password_reset_attempt
    conditions:
      - field: event.code
        value: '4724'
  - set:
      related.user: '[.user.target.name]'
    conditions:
      - field: event.code
        value: '4724'

  - set:
      event.category:
        value: [process, persistence]
      event.type:
        value: [creation, start]
      event.action:
        value: service_installed
    conditions:
      - field: event.code
        value: '7045'
  - set:
      file.name: basename!(.process.executable)
    conditions:
      - field: event.code
        value: '7045'
      - field: file.name
        exists: false
  - set:
      related.files: '[.file.path]'
    conditions:
      - field: event.code
        value: '7045'

  - set:
      event.category:
        value: [malware, configuration]
      event.type:
        value: [change]
      event.action:
        value: defender_scanning_disabled
    conditions:
      - field: event.code
        value: '5010'

  - set:
      event.category:
        value: [authentication]
      event.type:
        value: [protocol]
      event.action:
        value: ntlmv1_authentication_detected
    conditions:
      - field: event.code
        value: '6038'
