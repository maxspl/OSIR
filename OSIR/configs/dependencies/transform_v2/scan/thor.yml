metadata:
  version: "1.0"
  id: thor
  author: Typ
  description: THOR / THOR-Lite ECS normalization

transformation:
  - set:
      event.original: encode_json!(.)
    conditions:
      - field: event.original
        exists: false
  - set:
      event.kind:
        value: alert
      event.module:
        value: thor
      event.provider:
        value: Nextron THOR
      observer.vendor:
        value: Nextron Systems
      observer.product:
        value: THOR
      observer.type:
        value: scanner
  - set:
      timestamp: 'to_string(.time) ?? null'
      event.created: 'to_string(.time) ?? null'
    filter: 'exists(.time) && (to_string(.time) ?? "") != ""'
  - set:
      event.created: .timestamp
    filter: 'exists(.event_time) && (to_string(.event_time) ?? "") != "" && exists(.timestamp)'
  - set:
      timestamp: 'to_string(.event_time) ?? null'
    filter: 'exists(.event_time) && (to_string(.event_time) ?? "") != ""'
  - set:
      observer.hostname: 'to_string(.hostname) ?? null'
    filter: 'exists(.hostname) && (to_string(.hostname) ?? "") != ""'
  - set:
      host.name: 'to_string(.event_computer) ?? null'
      winlog.computer_name: 'to_string(.event_computer) ?? null'
    filter: 'exists(.event_computer) && (to_string(.event_computer) ?? "") != ""'
  - set:
      host.name: 'to_string(.hostname) ?? null'
    filter: '!exists(.event_computer) && exists(.hostname) && (to_string(.hostname) ?? "") != ""'
  - set:
      log.level: to_string(.level) ?? null
  - set:
      event.dataset: '"thor." + downcase!(to_string!(.module))'
      log.logger: to_string!(.module)
  - set:
      event.dataset:
        value: thor
    filter: '!exists(.event.dataset)'
  - set:
      message: to_string(.message) ?? null
      thor.scan.id: to_string(.scanid) ?? null
  - set:
      observer.version: to_string(.log_version) ?? null
      thor.log.version: to_string(.log_version) ?? null
  - set:
      event.risk_score: 'to_int(.score) ?? null'
      event.severity: 'to_int(.score) ?? null'
      thor.score: 'to_int(.score) ?? null'
    filter: 'exists(.score) && (to_int(.score) ?? null) != null'
  - set:
      rule.risk_score: 'to_int(.subscore_1) ?? null'
      thor.primary.subscore: 'to_int(.subscore_1) ?? null'
    filter: 'exists(.subscore_1) && (to_int(.subscore_1) ?? null) != null'
  - set:
      event.reason: to_string(.reason_1) ?? null
      thor.primary.reason: to_string(.reason_1) ?? null
  - set:
      rule.name: to_string(.rulename_1) ?? null
  - set:
      rule.name: to_string(.reason_1) ?? null
    filter: '!exists(.rule.name) && exists(.reason_1)'
  - set:
      rule.id: to_string(.id_1) ?? null
      rule.description: to_string(.description_1) ?? null
      rule.author: '[to_string!(.author_1)]'
      rule.reference: to_string(.ref_1) ?? null
      rule.created: to_string(.ruledate_1) ?? null
  - set:
      rule.ruleset: to_string(.sigtype_1) ?? null
      thor.primary.signature.type: to_string(.sigtype_1) ?? null
  - set:
      rule.category: to_string(.sigclass_1) ?? null
      thor.primary.signature.class: to_string(.sigclass_1) ?? null
  - set:
      thor.primary.false_positives: to_string(.falsepositives_1) ?? null
  - set:
      rule.tags: 'split!(to_string!(.tags_1), ",")'
      thor.primary.tags: to_string!(.tags_1)
    filter: 'exists(.tags_1) && (to_string(.tags_1) ?? "") != ""'
  - set:
      thor.primary.matched: matched_1
  - set:
      thor.reasons_count: 'to_int(.reasons_count) ?? null'
    filter: 'exists(.reasons_count) && (to_int(.reasons_count) ?? null) != null'
  # module categorization (default: thor-match)
  - set:
      module_lower: 'downcase!(to_string!(.module))'
  - set:
      event.category:
        value: [file, malware]
      event.type:
        value: [info]
      event.action:
        value: thor-filescan-match
    conditions:
      - field: module_lower
        value: filescan
  - set:
      event.category:
        value: [file, malware]
      event.type:
        value: [info]
      event.action:
        value: thor-logscan-match
    conditions:
      - field: module_lower
        value: logscan
  - set:
      event.category:
        value: [malware]
      event.type:
        value: [info]
      event.action:
        value: thor-evtx-match
    conditions:
      - field: module_lower
        value: evtx
  - set:
      event.category:
        value: [malware]
      event.type:
        value: [info]
      event.action:
        value: thor-match
    filter: '!exists(.event.action)'
  - delete:
      - module_lower
  # .file is a scalar path: stash it, drop the raw field, then build file.path
  - set:
      thor_file_path: 'to_string(.file) ?? null'
  - delete:
      - file
  - set:
      file.path: thor_file_path
      file.name: 'basename!(.thor_file_path)'
    filter: '.thor_file_path != ""'
  - delete:
      - thor_file_path
  - set:
      thor.primary.file.path: 'to_string(.file_1) ?? null'
    filter: 'exists(.file_1) && (to_string(.file_1) ?? "") != ""'
  - set:
      file.path: 'to_string(.file_1) ?? null'
      file.name: 'basename!(to_string!(.file_1))'
    filter: '!exists(.file.path) && exists(.file_1) && (to_string(.file_1) ?? "") != ""'
  - set:
      thor.primary.file.exists: to_string(.exists_1) ?? null
  - set:
      file.extension: 'replace(to_string!(.ext), ".", "")'
  - set:
      file.type: to_string(.type) ?? null
  - set:
      file.type: to_string(.type_1) ?? null
    filter: '!exists(.type) && exists(.type_1)'
  - set:
      file.size: 'to_int(.size) ?? null'
  - set:
      file.size: 'to_int(.size_1) ?? null'
    filter: '!exists(.size) && exists(.size_1) && (to_int(.size_1) ?? null) != null'
  - set:
      file.hash.md5: to_string(.md5) ?? null
  - set:
      file.hash.md5: to_string(.md5_1) ?? null
    filter: '!exists(.md5) && exists(.md5_1)'
  - set:
      file.hash.sha1: to_string(.sha1) ?? null
  - set:
      file.hash.sha1: to_string(.sha1_1) ?? null
    filter: '!exists(.sha1) && exists(.sha1_1)'
  - set:
      file.hash.sha256: to_string(.sha256) ?? null
  - set:
      file.hash.sha256: to_string(.sha256_1) ?? null
    filter: '!exists(.sha256) && exists(.sha256_1)'
  - set:
      file.mode: to_string(.permissions) ?? null
  - set:
      file.mode: to_string(.permissions_1) ?? null
    filter: '!exists(.permissions) && exists(.permissions_1)'
  - set:
      file.owner: to_string(.owner) ?? null
  - set:
      file.owner: to_string(.owner_1) ?? null
    filter: '!exists(.owner) && exists(.owner_1)'
  - set:
      file.group: to_string(.group) ?? null
  - set:
      file.group: to_string(.group_1) ?? null
    filter: '!exists(.group) && exists(.group_1)'
  - set:
      thor.file.first_bytes: to_string(.firstbytes) ?? null
  - set:
      thor.file.first_bytes: to_string(.firstbytes_1) ?? null
    filter: '!exists(.firstbytes) && exists(.firstbytes_1)'
  - set:
      winlog.event_id: 'to_int(.event_id) ?? null'
    filter: 'exists(.event_id) && (to_int(.event_id) ?? null) != null'
  - set:
      event.code: 'to_string!(to_int!(.event_id))'
    filter: 'exists(.event_id) && (to_int(.event_id) ?? null) != null'
  - set:
      event.code: 'to_string(.event_id) ?? null'
    filter: 'exists(.event_id) && (to_int(.event_id) ?? null) == null'
  - set:
      winlog.level: to_string(.event_level) ?? null
      winlog.channel: to_string(.event_channel) ?? null
      thor.entry: to_string(.entry) ?? .entry
      thor.log.modified: to_string(.log_modified) ?? null
      thor.log.accessed: to_string(.log_accessed) ?? null
  - delete:
      - time
      - hostname
      - level
      - module
      - scanid
      - score
      - subscore_1
      - reason_1
      - rulename_1
      - id_1
      - description_1
      - author_1
      - ref_1
      - ruledate_1
      - sigtype_1
      - sigclass_1
      - falsepositives_1
      - tags_1
      - matched_1
      - reasons_count
      - event_id
      - event_level
      - event_channel
      - event_computer
      - event_time
      - log_version
      - file_1
      - exists_1
      - ext
      - type
      - type_1
      - size
      - size_1
      - md5
      - md5_1
      - sha1
      - sha1_1
      - sha256
      - sha256_1
      - changed
      - changed_1
      - modified
      - modified_1
      - accessed
      - accessed_1
      - permissions
      - permissions_1
      - owner
      - owner_1
      - group
      - group_1
      - firstbytes
      - firstbytes_1
      - log_modified
      - log_accessed
      - entry
