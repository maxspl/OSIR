metadata:
  version: "2.0"
  author: Kelly Brazil
  description: Kelly Brazil - JsonConverter - Parsing the output of the command blkid
  os: unix

configuration:
  module: blkid
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool: 
  path: cat
  cmd: "{input_file} | jc --blkid | jq -c '.[]'> {output_file}"

input:
  type: file
  paths: 
    - r"blkid\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/storage"
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:live_response:storage:blkid':
    name_rex: r"blkid.*\.jsonl$"
    path_suffix: storage
    sourcetype: 'linux:live_response:storage:blkid'
    host_rex: r"([\w\.-]+?)--"
    artifact: blkid
