metadata:
  version: "1.0"
  id: enumlocs
  author: Typ
  description: Windows enumlocs

transformation:
  - custom: |2-
      if !exists(.event) || !exists(.event.original) {
          .event.original = encode_json!(.)
      }
  - set:
      event.provider:
        value: Windows enumlocs volume inventory
  - custom: |2-
      if exists(.type) {
          .action.properties.type = to_string!(del(.type))
      }
  - set:
      action.properties.volume_id: to_string!(del(.volume_id))
      action.properties.volume_filesystem: to_string!(del(.filesystem))
      action.properties.volume_status: to_string!(del(.status))
      action.properties.volume_entries: del(.entries)
      action.properties.volume_mounted_volumes: del(.MountedVolume)
      action.properties.volume_physical_drive_volume_raw: del(.PhysicalDriveVolume)
      action.properties.volume_disk_interface_volume_raw: del(.DiskInterfaceVolume)
      action.properties.volume_snapshots: del(.Snapshot)
  - custom: |2-
      if exists(.parameters) {

          if exists(.parameters."Start time") {
              start_raw = to_string!(del(.parameters."Start time"))
              ts = parse_timestamp(start_raw, "%+") ?? null
              if ts != null {
                  .event.start = ts
                  .action.properties.start_time = ts
              } else {
                  .action.properties.start_time_raw = start_raw
              }
          }

          if exists(.parameters."Computer name") {
              comp_name = to_string!(del(.parameters."Computer name"))

              if !exists(.host.name) {
                  .host.name = comp_name
              }
              .action.properties.computer_name = comp_name
          }

          if exists(.parameters."Operating system") {
              os_full = to_string!(del(.parameters."Operating system"))
              .host.os.full = os_full
              .action.properties.operating_system = os_full
          }

          if exists(.parameters."User") {
              user_raw = to_string!(del(.parameters."User"))
              .action.properties.user_raw = user_raw

              if contains(user_raw, " (elevated)") {
                  .action.properties.elevated = true
                  .action.properties.user_clean = replace!(user_raw, " (elevated)", "")
              } else {
                  .action.properties.user_clean = user_raw
              }

              .action.properties.user_split = split!(.action.properties.user_clean, "\\\\")
              if length(.action.properties.user_split) == 2 {
                  .user.domain   = .action.properties.user_split[0]
                  .user.name     = .action.properties.user_split[1]
                  .user.full_name = .action.properties.user_split[1]
              } else {
                  .user.name = .action.properties.user_clean
              }
          }

          if exists(.parameters."System type") {
              sys_type = to_string!(del(.parameters."System type"))
              .host.type = sys_type
              .action.properties.system_type = sys_type
          }

          if exists(.parameters."System tags") {
              .action.properties.system_tags_raw = to_string!(del(.parameters."System tags"))
          }

          if exists(.parameters."Log file") {
              .action.properties.log_file = to_string!(del(.parameters."Log file"))
          }

          if exists(.parameters."Syslog") {
              .action.properties.syslog = to_string!(del(.parameters."Syslog"))
          }

          if length(keys(.parameters) ?? []) > 0 {
              .action.properties.parameters = del(.parameters)
          } else {
              del(.parameters)
          }
      }
