metadata:
  version: "1.0"
  author: maxspl
  description: Docker images present on the host
  os: unix

configuration:
  module: docker_images
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --asciitable | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/docker_image_ls.*\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/containers"
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:live_response:containers:docker_images':
    name_rex: r"--docker_images-.*\.jsonl$"
    path_suffix: containers
    sourcetype: 'linux:live_response:containers:docker_images'
    host_rex: r"([\w\.-]+?)--"
    artifact: docker_images
