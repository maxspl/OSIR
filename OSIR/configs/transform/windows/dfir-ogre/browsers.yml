metadata:
  version: "1.0"
  id: browsers
  author: Typ
  description: Browser artifacts (dfir-ogre chrome/firefox JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  # history: url, title, visit_date, visit_count, hidden, referer, ogre_md
  # visit_date is absent for URLs never visited: ogre_md marks the flavour,
  # not visit_date
  - set:
      url.original: url
      action.properties.title: title
      action.properties.visit_count:
        source: visit_count
        operation: to_int
      action.properties.hidden:
        source: hidden
        operation: to_int
      action.properties.referer: referer
    filter: exists(.ogre_md) && !exists(.target_path)

  - set:
      timestamp:
        source: visit_date
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
    filter: exists(.visit_date) && .visit_date != ""

  # downloads: target_path, url, received_bytes, total_bytes, start_time,
  #            end_time, state, danger_type, interrupt_reason, opened, ogre_md
  - set:
      file.path: target_path
      url.original: url
      file.size:
        source: total_bytes
        operation: to_int
      action.properties.received_bytes:
        source: received_bytes
        operation: to_int
      action.properties.state: state
      action.properties.danger_type: danger_type
      action.properties.deleted:
        source: deleted
        operation: to_bool
      action.properties.interrupt_reason: interrupt_reason
      action.properties.opened:
        source: opened
        operation: to_bool
      timestamp:
        source: start_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      event.start:
        source: start_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      file.mtime:
        source: end_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      event.end:
        source: end_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
    filter: exists(.target_path) && !exists(.filename)

  # basename() is fallible and Windows backslashes are not path separators:
  # extract the file name from the OGRE download target_path
  - custom: |2-
      if exists(.target_path) && !exists(.filename) {
          bn, berr = basename(replace(to_string!(.target_path), pattern: "\\", with: "/"))
          if berr == null {
              .file.name = bn
          }
      }

  - delete:
      - title
      - visit_count
      - visit_date
      - hidden
      - referer
      - ogre_md
      - target_path
      - received_bytes
      - total_bytes
      - start_time
      - end_time
      - state
      - danger_type
      - interrupt_reason
      - deleted
      - opened

timeline:
  - id: visited
    message: "User {user.name} visited {url.original}"
    conditions:
      - field: action.properties.visit_count
        exists: true

  - id: downloaded
    message: "User {user.name} downloaded {file.name} to {file.path}"
    conditions:
      - field: file.path
        exists: true

relationships:
  - id: visited
    source: user.name
    target: url.original
    type: visited

  - id: downloaded
    source: user.name
    target: file.path
    type: downloaded to
