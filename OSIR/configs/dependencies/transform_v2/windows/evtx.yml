metadata:
  version: '1.0'
  id: evtx
  author: Typ
  description: windows-eventlog | Osir Transform description to normalize EVTX.

transformation:
  - set:
      timestamp: .Event.System.TimeCreated."#attributes".SystemTime
      action.system: Event.System
      action.properties: Event.EventData
      action.properties.Attributes: Event.EventData.Attributes
      action.properties.Requester: Event.EventData.Requester
      action.properties.ContextInfo: Event.EventData.ContextInfo
      action.properties.CallingStationID: Event.EventData.CallingStationID
      action.properties.BytesTotal: Event.EventData.bytesTotal
      action.properties.ConfigurationFile: Event.EventData.Configuration
      action.properties.FileVersion: Event.EventData.FileVersion
      action.properties.Product: Event.EventData.Product
      action.properties.Description: Event.EventData.Description
      action.properties.ThreatName: Event.EventData.ThreatName
      action.properties.DetectionUser: Event.EventData.DetectionUser
      action.properties.HealthAttestationServer: Event.EventData.HealthAttestationServer
      action.properties.LastASSecurityIntelligenceAge: Event.EventData.LastASSecurityIntelligenceAge
      action.properties.LastAVSecurityIntelligenceAge: Event.EventData.LastAVSecurityIntelligenceAge
      action.properties.LastFullScanAge: Event.EventData.LastFullScanAge
      action.properties.LastQuickScanAge: Event.EventData.LastQuickScanAge
      action.properties.NewValue: Event.EventData.NewValue
      action.properties.SentUpdateServer: Event.EventData.SentUpdateServer
      action.properties.ServiceFileName: Event.EventData.ServiceFileName
      action.properties.StatusInformation: Event.EventData.StatusInformation
      action.properties.Subject: Event.EventData.Subject
      action.properties.TransmittedServices: Event.EventData.TransmittedServices
  - custom: |2-
      if is_object(.Event.UserData) {
        ud_obj = object!(.Event.UserData)
        ud_keys = keys(ud_obj)
        if length(ud_keys) > 0 {
          ud_root = string!(ud_keys[0])
          ud = get!(ud_obj, [ud_root])
          if is_object(ud) {
            ud_attrs = object(get(ud, ["#attributes"]) ?? {}) ?? {}
            ud_attrs = remove!(ud_attrs, ["xmlns"])
            ud = remove!(ud, ["#attributes"])
            .action.properties = merge(object(.action.properties) ?? {}, merge(ud_attrs, object!(ud)))
          } else {
            .action.properties = merge(object(.action.properties) ?? {}, set!({}, [ud_root], ud))
          }
          .action.properties.UserDataType = ud_root
        }
      }
  - set:
      action.properties.Image: Event.EventData.Image
    filter: exists(.Event.EventData.Image)
  - set:
      action.properties.Image: parsed_message_kv.Image
    filter: '!exists(.Event.EventData.Image)'
  - set:
      action.properties.DestinationPort: Event.EventData.DestinationPort
    filter: exists(.Event.EventData.DestinationPort)
  - set:
      action.properties.DestinationPort: Event.EventData.DestPort
    filter: '!exists(.action.properties.DestinationPort)'
  - set:
      action.properties.ErrorCode: Event.EventData.ErrorCode
    filter: exists(.Event.EventData.ErrorCode)
  - set:
      action.properties.ProcessName: Event.EventData.ProcessName
    filter: exists(.Event.EventData.ProcessName)
  - set:
      event.code: to_int!(.Event.System.EventID."#text")
  - set:
      event.code: to_int!(.Event.System.EventID)
    filter: '!exists!(.event.code)'
  - set:
      event.record: to_string!(.Event.System.EventRecordID)
      event.id: event.code
      action.type: to_string!(.Event.System.Channel)
  - translate:
      mapping:
        action.name: event.id
