metadata:
  version: "1.0"
  author: maxspl
  description: YARA/IOC scan of the filesystem using Loki-RS.
  os: generic

configuration:
  module: loki_orc
  type: process
  disk_only: false
  no_multithread: true
  processor_type:
  - external
  processor_os: unix

tool:
  path: loki-rs/loki_scan.sh
  cmd: --folder {input_dir} --jsonl {output_file} --no-procs --no-tui --no-html
    --no-log --scan-all-files --threads=-2
  source: https://github.com/Neo23x0/Loki-RS
  version: 2.12.0

input:
  type: dir
  paths: 
    - restore_fs/*
    - r"extract_uac\/[^\/]+\/extracted_files$"

output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"restore_fs\/(.*)"
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'scan:loki':
    name_rex: r"\.jsonl$"
    path_suffix: 'loki_orc'
    sourcetype: 'scan:loki'
    host_rex: r"([\w\.-]+)--"
    timestamp_path:
      - "timestamp"
    timestamp_format: "%Y-%m-%dT%H:%M:%SZ"
    artifact: "Loki"
    normalize:
      - .vrl/scan/loki.vrl
