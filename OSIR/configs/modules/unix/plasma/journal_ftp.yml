metadata:
  version: "1.0"
  author: maxspl
  description: FTP events from the systemd journal
  os: unix

configuration:
  module: journal_ftp
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_journal_ftp

splunk:
  'linux:journal_ftp':
    name_rex: \.jsonl$
    path_suffix: journal_ftp
    sourcetype: 'linux:journal_ftp'
    host_rex: ([\w\.-]+?)--
    timestamp_path:
        - "journal_time"
    timestamp_format: "%Y-%m-%dT%H:%M:%S.%f%z"
    artifact: "journal_ftp"
