metadata:
  version: "1.0"
  author: maxspl
  description: Local groups from /etc/group
  os: unix

configuration:
  module: group
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_group

splunk:
  'linux:group':
    name_rex: \.jsonl$
    path_suffix: group
    sourcetype: 'linux:group'
    host_rex: ([\w\.-]+?)--
    artifact: "group"
