metadata:
  version: "1.0"
  author: maxspl
  description: Installed packages from the dpkg status database
  os: unix

configuration:
  module: dpkg_status
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_dpkg

splunk:
  'linux:dpkg_status':
    name_rex: \.jsonl$
    path_suffix: dpkg_status
    sourcetype: 'linux:dpkg_status'
    host_rex: ([\w\.-]+?)--
    artifact: "dpkg_status"
