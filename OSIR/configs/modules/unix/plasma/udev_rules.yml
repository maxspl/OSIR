metadata:
  version: "1.0"
  author: maxspl
  description: udev rules, a known persistence location
  os: unix

configuration:
  module: udev_rules
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  dissector: linux_udev_rules

splunk:
  'linux:udev_rules':
    name_rex: r"\.jsonl$"
    path_suffix: udev_rules
    sourcetype: 'linux:udev_rules'
    host_rex: r"([\w\.-]+?)--"
    artifact: "udev_rules"
