metadata:
  version: "1.0"
  id: mongodb
  author: Typ
  description: OSIR - MongoDB log normalizer

transformation:
  # timestamp: MongoDB extended JSON {"$date": ...} in .t
  - set:
      timestamp: 'get(.t, ["$date"]) ?? null'
    filter: exists(.t)
  - delete:
      - t
  # severity: F/E/W/I mapped, D* kept as "debug <code>", anything else verbatim
  - set:
      event.severity:
        value: fatal
    conditions:
      - field: s
        value: F
  - set:
      event.severity:
        value: error
    conditions:
      - field: s
        value: E
  - set:
      event.severity:
        value: warning
    conditions:
      - field: s
        value: W
  - set:
      event.severity:
        value: informational
    conditions:
      - field: s
        value: I
  - set:
      event.severity: '"debug " + string!(.s)'
    filter: '!exists(.event.severity) && starts_with(string!(.s), "D")'
  - set:
      event.severity: 'string!(.s)'
    filter: '!exists(.event.severity) && exists(.s)'
  - delete:
      - s
  - set:
      event.kind: to_string!(del(.c))
  - set:
      event.id: del(.id)
  - set:
      event.context: to_string!(del(.ctx))
  - set:
      service.name: to_string!(del(.svc))
  - set:
      message: to_string!(del(.msg))
  - set:
      log: del(.attr)
  # remote "ip:port" split and nested {"$uuid"} extraction: per-part parsing
  # with no declarative equivalent (and the nested delete can't be expressed
  # as a delete block without tripping the flat-field mechanism).
  - custom: |2-
      if exists(.log.remote) {
          remote_val = to_string!(.log.remote)
          parts = split(remote_val, ":")
          if length(parts) == 2 {
              .source.address = remote_val
              .source.ip = parts[0]
              .source.port = to_int!(parts[1])
          }
          del(.log.remote)
      }

      if exists(.log.uuid.uuid) {
          uuid_val, err = get(.log.uuid.uuid, ["$uuid"])
          if uuid_val != null {
              .log.uuid = to_string!(uuid_val)
          }
          del(.log.uuid.uuid)
      }
  - set:
      log.tags: del(.tags)
  - set:
      log.truncated: del(.truncated)
  - set:
      log.size: del(.size)
