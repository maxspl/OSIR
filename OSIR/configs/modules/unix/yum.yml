metadata:
  version: "2.0"
  author: Typ
  description: Parsing logs from '/var/log/yum'
  os: unix

configuration:
  module: yum
  type: process
  disk_only: true
  no_multithread: true
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  name: (?:yum)
  path: var/log

output:
  type: single_file
  format: json
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint: 
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:yum':
    name_rex: yum.*\.jsonl$
    sourcetype: 'linux:yum'
    host_rex: ([\w\.-]+?)--
    timestamp_path:
        - "_time"
    timestamp_format: "%Y-%m-%dT%H:%M:%S"
    artifact: "yum"
