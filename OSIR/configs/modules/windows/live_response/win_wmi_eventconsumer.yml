metadata:
  version: "2.0"
  author: maxspl
  description: Parse EventConsumer.txt from DFIR ORC (powershell.exe Get-WMIObject -Namespace root\Subscription -Class __EventConsumer command)
  os: windows

configuration:
  module: win_wmi_eventconsumer
  alt_module: live_response_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  name: EventConsumer.txt
  path: extracted_files/Powershell/

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"/Endpoint_(.*?)/"
      default: "UNKNOWN"

optional:
  parser: wmi_eventconsumer

splunk:
  'windows:live_response:wmi_consummer':
    name_rex: r"--win_wmi_eventconsumer\.jsonl$"
    path_suffix: win_wmi_eventconsumer 
    host_rex: r"([\w\.-]+)--"
    artifact: "WMI"
    normalize:
      - ecs_normalize/windows/live_response/wmi_eventconsumer.vrl
