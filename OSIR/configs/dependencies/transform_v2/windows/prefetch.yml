metadata:
  version: "1.0"
  id: prefetch
  author: Typ
  description: Windows Prefetch JSONL (PECmd) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.dataset:
        value: windows.prefetch
      event.module:
        value: windows
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [start, info]
      event.provider:
        value: "Windows Prefetch"
      event.action:
        value: prefetch_entry
      event.outcome:
        value: success

  - set:
      file.path: SourceFilename
      process.name: ExecutableName
      labels.hash: Hash
      labels.version: Version

  - set:
      timestamp:
        source: LastRun
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      event.start:
        source: LastRun
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.last_run:
        source: LastRun
        operation: parse_timestamp
        parameters:
          format: "%F %T"

  - set:
      file.created:
        source: SourceCreated
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      file.mtime:
        source: SourceModified
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      file.accessed:
        source: SourceAccessed
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      file.size:
        source: Size
        operation: to_int

  - set:
      labels.run_count:
        source: RunCount
        operation: to_int
      labels.previous_run0:
        source: PreviousRun0
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.previous_run1:
        source: PreviousRun1
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.previous_run2:
        source: PreviousRun2
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.previous_run3:
        source: PreviousRun3
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.previous_run4:
        source: PreviousRun4
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.previous_run5:
        source: PreviousRun5
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.previous_run6:
        source: PreviousRun6
        operation: parse_timestamp
        parameters:
          format: "%F %T"

  - set:
      labels.volume0_name: Volume0Name
      labels.volume0_serial: Volume0Serial
      labels.volume1_name: Volume1Name
      labels.volume1_serial: Volume1Serial

  - set:
      labels.volume0_created:
        source: Volume0Created
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.volume1_created:
        source: Volume1Created
        operation: parse_timestamp
        parameters:
          format: "%F %T"

  - set:
      labels.directories:
        source: Directories
        operation: split
        parameters:
          pattern: ", "
      labels.files_loaded:
        source: FilesLoaded
        operation: split
        parameters:
          pattern: ", "


  - delete:
      - SourceFilename
      - SourceCreated
      - SourceModified
      - SourceAccessed
      - ExecutableName
      - Hash
      - Size
      - Version
      - RunCount
      - LastRun
      - PreviousRun0
      - PreviousRun1
      - PreviousRun2
      - PreviousRun3
      - PreviousRun4
      - PreviousRun5
      - PreviousRun6
      - Volume0Name
      - Volume0Serial
      - Volume0Created
      - Volume1Name
      - Volume1Serial
      - Volume1Created
      - Directories
      - FilesLoaded
      - ParsingError

timeline:
  - id: executed
    message: "Program {process.name} was executed (last run {timestamp})"

relationships:
  - id: executed
    source: process.name
    target: file.path
    type: recorded in
