metadata:
  version: "1.0"
  id: hives
  author: Typ
  description: Registry artifacts (RECmd CSV + dfir-ogre hive JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.dataset:
        value: windows.registry
      event.module:
        value: windows
      event.kind:
        value: event
      event.category:
        value: [registry]
      event.type:
        value: [info]
      event.provider:
        value: "Windows Registry"
      event.outcome:
        value: success

  # -- RECmd (Zimmerman) input --------------------------------------------------

  # HivePath, HiveType, Description, Category, KeyPath, ValueName, ValueType,
  # ValueData, ValueData2, ValueData3, Comment, Recursive, Deleted,
  # LastWriteTimestamp, PluginDetailFile
  - set:
      registry.path: KeyPath
      registry.value: ValueName
      registry.data.type: ValueType
      registry.hive: HiveType
      labels.hive_path: HivePath
      labels.description: Description
      labels.category: Category
      labels.comment: Comment
      labels.value_data: ValueData
      labels.value_data2: ValueData2
      labels.value_data3: ValueData3
      labels.recursive:
        source: Recursive
        operation: to_bool
      labels.deleted:
        source: Deleted
        operation: to_bool
      labels.plugin_detail_file: PluginDetailFile
      timestamp:
        source: LastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.HiveType) && exists(.KeyPath)

  # -- RECmd DFIRBatch UserAccounts (SAM) input ---------------------------------

  # ValidUserId, BatchKeyPath, BatchValueName, UserId, InvalidLoginCount,
  # TotalLoginCount, CreatedOn, LastLoginTime, LastPasswordChange,
  # LastIncorrectPassword, ExpiresOn, UserName, FullName, PasswordHint, Groups,
  # Comment, UserComment, HomeDirectory, InternetUserName, ResetData,
  # AccountDisabled, HomeDirectoryRequired, PasswordNotRequired,
  # TempDuplicateAccount, NormalUserAccount, MnsLogonAccount,
  # InterdomainTrustAccount, WorkstationTrustAccount, ServerTrustAccount,
  # PasswordDoesNotExpire, AutoLocked
  - set:
      registry.path: BatchKeyPath
      registry.value: BatchValueName
      registry.hive:
        value: SAM
      user.id: UserId
      user.name: UserName
      user.full_name: FullName
      user.email: InternetUserName
      labels.password_hint: PasswordHint
      labels.groups: Groups
      labels.comment: Comment
      labels.user_comment: UserComment
      labels.home_directory: HomeDirectory
      labels.valid_user_id:
        source: ValidUserId
        operation: to_bool
      labels.invalid_login_count:
        source: InvalidLoginCount
        operation: to_int
      labels.total_login_count:
        source: TotalLoginCount
        operation: to_int
      labels.reset_data:
        source: ResetData
        operation: to_bool
      labels.account_disabled:
        source: AccountDisabled
        operation: to_bool
      labels.home_directory_required:
        source: HomeDirectoryRequired
        operation: to_bool
      labels.password_not_required:
        source: PasswordNotRequired
        operation: to_bool
      labels.temp_duplicate_account:
        source: TempDuplicateAccount
        operation: to_bool
      labels.normal_user_account:
        source: NormalUserAccount
        operation: to_bool
      labels.mns_logon_account:
        source: MnsLogonAccount
        operation: to_bool
      labels.interdomain_trust_account:
        source: InterdomainTrustAccount
        operation: to_bool
      labels.workstation_trust_account:
        source: WorkstationTrustAccount
        operation: to_bool
      labels.server_trust_account:
        source: ServerTrustAccount
        operation: to_bool
      labels.password_does_not_expire:
        source: PasswordDoesNotExpire
        operation: to_bool
      labels.auto_locked:
        source: AutoLocked
        operation: to_bool
    filter: exists(.BatchKeyPath) && exists(.UserId)

  - set:
      timestamp:
        source: CreatedOn
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.CreatedOn) && .CreatedOn != ""

  - set:
      labels.last_login_time:
        source: LastLoginTime
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastLoginTime) && .LastLoginTime != ""

  - set:
      labels.last_password_change:
        source: LastPasswordChange
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastPasswordChange) && .LastPasswordChange != ""

  - set:
      labels.last_incorrect_password:
        source: LastIncorrectPassword
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastIncorrectPassword) && .LastIncorrectPassword != ""

  - set:
      labels.expires_on:
        source: ExpiresOn
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.ExpiresOn) && .ExpiresOn != ""

  # -- OGRE (dfir-ogre hive) input ----------------------------------------------

  # path, mtime, name, data, type, size, is_placeholder,
  # security_descriptor, ogre_md
  - set:
      registry.path:
        source: 'replace(to_string!(.path), pattern: "\\\\", with: "\\")'
      registry.value: name
      registry.data.type: type
      labels.value_data: data
      registry.mtime:
        source: mtime
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      timestamp:
        source: mtime
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      labels.value_size:
        source: size
        operation: to_int
      labels.is_placeholder:
        source: is_placeholder
        operation: to_bool
      labels.security_descriptor: security_descriptor
    filter: exists(.path) && exists(.mtime)

  - delete:
      - HivePath
      - HiveType
      - Description
      - Category
      - KeyPath
      - ValueName
      - ValueType
      - ValueData
      - ValueData2
      - ValueData3
      - Comment
      - Recursive
      - Deleted
      - LastWriteTimestamp
      - PluginDetailFile
      - ValidUserId
      - BatchKeyPath
      - BatchValueName
      - UserId
      - InvalidLoginCount
      - TotalLoginCount
      - CreatedOn
      - LastLoginTime
      - LastPasswordChange
      - LastIncorrectPassword
      - ExpiresOn
      - UserName
      - FullName
      - PasswordHint
      - Groups
      - UserComment
      - HomeDirectory
      - InternetUserName
      - ResetData
      - AccountDisabled
      - HomeDirectoryRequired
      - PasswordNotRequired
      - TempDuplicateAccount
      - NormalUserAccount
      - MnsLogonAccount
      - InterdomainTrustAccount
      - WorkstationTrustAccount
      - ServerTrustAccount
      - PasswordDoesNotExpire
      - AutoLocked
      - path
      - mtime
      - name
      - data
      - type
      - size
      - is_placeholder
      - security_descriptor
      - ogre_md

timeline:
  - id: registry-value
    message: "Registry value {registry.value} exists in key {registry.path}"
    conditions:
      - field: registry.path
        exists: true

  - id: user-account
    message: "User account {user.name} (RID {user.id}) exists in SAM"
    conditions:
      - field: registry.hive
        value: SAM
      - field: user.id
        exists: true

relationships:
  - id: registry-value
    source: registry.path
    target: registry.value
    type: contains
