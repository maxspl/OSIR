metadata:
  version: "2.0"
  author: maxspl
  description: Parsing of browsers artifact.
  os: windows

configuration:
  module: browsers
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool: 
  path: python
  cmd: /OSIR/OSIR/bin/BrowserParser/main.py "{input_dir}" "{output_dir}" --csv
  source: https://github.com/maxspl/BrowserParser
  version: 1.1.0

input:
  type: dir
  path: r"restore_fs\/[^\/]+\/C$"

output:
  type: multiple_files
  format: jsonl
  output_prefix: "{extracted_endpoint}--{module}-"

extracted:
  - endpoint:
      patterns:
        - r"restore_fs\/(.*?)\/"
      default: "UNKNOWN"

splunk:
  'application:firefox:history':
    name_rex: r".*firefox.*_history\.csv$"
    path_suffix: 'browsers'
    sourcetype: 'application:firefox:history'
    host_rex: r"([\w\.-]+)--"
    user_rex: r"browsers-([^-_]+)_"
    artifact: "firefox"
    timestamp_path:
      - "timestamp"
    timestamp_format: "%Y-%m-%dT%H:%M:%SZ"
    normalize:
      - .vrl/windows/browsers.vrl
  'application:firefox:historyvisits':
    name_rex: r".*firefox.*_historyvisits\.csv$"
    path_suffix: 'browsers'
