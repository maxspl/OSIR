metadata:
  version: "2.0"
  author: maxspl
  description: Scan of file system using Thor (requires Forensic license).
  os: generic

configuration:
  module: thor_orc_ram
  type: process
  disk_only: false
  no_multithread: true
  processor_type:
  - external
  processor_os: unix

tool: 
  path: thor/thor-linux-64
  cmd: --lab --nocsv --silent --nolog -p {input_dir} --jsonfile {output_file}
  source: https://www.nextron-systems.com/thor/
  version: 1.0

input:
  type: dir
  paths: 
    - "win_memory/*"
    - r"extract_uac\/[^\/]+\/extracted_files$"
    - "restore_fs/*"
output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}-ram.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"win_memory\/(.*?)--win_memory-restore_fs-ram"
        - r"extract_uac\/Endpoint_(.*?)\/"
        - r"restore_fs\/(.*)"
      default: "UNKNOWN"

splunk:
  'scan:thor':
    name_rex: r"\.jsonl$"
    path_suffix: 'thor'
    sourcetype: 'scan:thor'
    host_rex: r"([\w\.-]+)--"
    timestamp_path:
      - "timestamp" 
    timestamp_format: "%Y-%m-%dT%H:%M:%SZ"
    artifact: "Thor"
    normalize:
      - .vrl/scan/thor.vrl
