metadata:
  version: "2.0"
  author: Typ
  description: Parse user infos from UAC [root] using Dissect plugin
  os: unix

configuration:
  module: user_details
  alt_module: dissect_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  plugin: users

splunk:
  'linux:user_details':
    name_rex: r"\.jsonl$"
    path_suffix: user_details
    sourcetype: 'linux:user_details'
    host_rex: r"([\w\.-]+?)--"
    artifact: "user_details"
