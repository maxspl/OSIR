metadata:
  version: "1.0"
  id: NTFSInfo
  author: Typ
  description: Windows NTFSInfoFull_detail CSV → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.action:
        value: ntfs_file
      event.provider:
        value: Windows NTFSInfo (detail)

  - set:
      file.name: File
      file.size:
        source: SizeInBytes
        operation: to_int
      file.attributes: Attributes
      file.owner: Owner
      host.name: ComputerName

  # empty FullName must not shadow the directory + name rebuild below
  - set:
      file.path: FullName
    filter: exists(.FullName) && .FullName != ""

  # $STANDARD_INFORMATION timestamps, ECS naming
  - set:
      file.created:
        source: CreationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.CreationDate) && .CreationDate != ""

  - set:
      file.mtime:
        source: LastModificationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastModificationDate) && .LastModificationDate != ""

  - set:
      file.accessed:
        source: LastAccessDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastAccessDate) && .LastAccessDate != ""

  - set:
      file.ctime:
        source: LastAttrChangeDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastAttrChangeDate) && .LastAttrChangeDate != ""

  # $FILE_NAME timestamps, ECS-style naming on the fn_* attributes:
  # fn_created, fn_mtime, fn_accessed, fn_ctime (attribute/metadata change)
  - set:
      file.fn_created:
        source: FileNameCreationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameCreationDate) && .FileNameCreationDate != ""

  - set:
      file.fn_mtime:
        source: FileNameLastModificationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameLastModificationDate) && .FileNameLastModificationDate != ""

  - set:
      file.fn_accessed:
        source: FileNameLastAccessDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameLastAccessDate) && .FileNameLastAccessDate != ""

  - set:
      file.fn_ctime:
        source: FileNameLastAttrModificationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameLastAttrModificationDate) && .FileNameLastAttrModificationDate != ""

  - set:
      hash.md5: MD5
    filter: exists(.MD5) && .MD5 != ""

  - set:
      hash.sha1: SHA1
    filter: exists(.SHA1) && .SHA1 != ""

  - set:
      hash.sha256: SHA256
    filter: exists(.SHA256) && .SHA256 != ""

  - set:
      hash.ssdeep: SSDeep
    filter: exists(.SSDeep) && .SSDeep != ""

  - set:
      pe.file_version: Version
      pe.company: CompanyName
      pe.product: ProductName
      pe.original_file_name: OriginalFileName

  - set:
      code_signature.subject_name: AuthenticodeSigner
      code_signature.issuer_name: AuthenticodeCA

  # ParentName carries a \r / \f suffix marker: strip it for file.directory,
  # rebuild file.path from directory + name when FullName is missing
  - custom: |2-
      if exists(.ParentName) {
          dir_norm = to_string!(.ParentName)
          if ends_with(dir_norm, "\\r") || ends_with(dir_norm, "\\f") {
              len = length(dir_norm)
              if len > 2 {
                  dir_norm = slice!(dir_norm, 0, len - 2)
              }
          }
          .file.directory = dir_norm
      }

      if !exists(.file.path) && exists(.file.name) {
          fname = to_string!(.file.name)

          if exists(.file.directory) {
              dir = to_string!(.file.directory)
              if dir != "" {
                  if ends_with(dir, "\\") {
                      .file.path = dir + fname
                  } else {
                      .file.path = dir + "\\" + fname
                  }
              } else {
                  .file.path = fname
              }
          } else {
              .file.path = fname
          }
      }

      if exists(.Extension) {
          ext_raw = to_string!(.Extension)
          if ext_raw != "" {
              if starts_with(ext_raw, ".") {
                  .file.extension = slice!(ext_raw, 1)
              } else {
                  .file.extension = ext_raw
              }
          }
      }

  # Authenticode status: derive code_signature.trusted from the raw text
  - custom: |2-
      if exists(.AuthenticodeStatus) {
          as_l = downcase!(to_string!(.AuthenticodeStatus))
          if as_l != "" {
              if contains(as_l, "trusted") || contains(as_l, "valid") {
                  .code_signature.trusted = true
              } else if contains(as_l, "invalid") || contains(as_l, "revoked") || contains(as_l, "not trusted") {
                  .code_signature.trusted = false
              }
          }
      }

  # complementary info: action.properties, not event
  - set:
      action.properties.VolumeID: VolumeID
      action.properties.USN: USN
      action.properties.FRN: FRN
      action.properties.ParentFRN: ParentFRN
      action.properties.ExtendedAttribute: ExtendedAttribute
      action.properties.ADS: ADS
      action.properties.FilenameID: FilenameID
      action.properties.DataID: DataID
      action.properties.RecordInUse: RecordInUse
      action.properties.ShortName: ShortName
      action.properties.PeSHA1: PeSHA1
      action.properties.PeSHA256: PeSHA256
      action.properties.PeMD5: PeMD5
      action.properties.FirstBytes: FirstBytes
      action.properties.TLSH: TLSH
      action.properties.SignedHash: SignedHash
      action.properties.OwnerId: OwnerId
      action.properties.OwnerSid: OwnerSid
      action.properties.Platform: Platform
      action.properties.TimeStamp: TimeStamp
      action.properties.SubSystem: SubSystem
      action.properties.FileType: FileType
      action.properties.FileOS: FileOS
      action.properties.FilenameFlags: FilenameFlags
      action.properties.SecDescrID: SecDescrID
      action.properties.EASize: EASize
      action.properties.SecurityDirectory: SecurityDirectory
      action.properties.SecurityDirectorySize: SecurityDirectorySize
      action.properties.SecurityDirectorySignatureSize: SecurityDirectorySignatureSize
      action.properties.AuthenticodeStatus: AuthenticodeStatus
      action.properties.AuthenticodeSignerThumbprint: AuthenticodeSignerThumbprint
      action.properties.AuthenticodeCAThumbprint: AuthenticodeCAThumbprint
      action.properties.FilenameIndex: FilenameIndex
      action.properties.DataIndex: DataIndex
      action.properties.SnapshotID: SnapshotID

  # primary timestamp: mtime, accessed then created as fallbacks
  - custom: |2-
      ts_value = null
      ts_source = null
      if exists(.file.mtime) {
          ts_value = .file.mtime
          ts_source = "ntfs_last_modification"
      } else if exists(.file.accessed) {
          ts_value = .file.accessed
          ts_source = "ntfs_last_access"
      } else if exists(.file.created) {
          ts_value = .file.created
          ts_source = "ntfs_creation"
      }
      if ts_value != null {
          .timestamp = ts_value
          if !exists(.event.created) {
              .event.created = ts_value
          }
          .action.properties.timestamp_source = ts_source
      }

  - delete:
      - ComputerName
      - VolumeID
      - File
      - ParentName
      - FullName
      - Extension
      - SizeInBytes
      - Attributes
      - CreationDate
      - LastModificationDate
      - LastAccessDate
      - LastAttrChangeDate
      - FileNameCreationDate
      - FileNameLastModificationDate
      - FileNameLastAccessDate
      - FileNameLastAttrModificationDate
      - USN
      - FRN
      - ParentFRN
      - ExtendedAttribute
      - ADS
      - FilenameID
      - DataID
      - RecordInUse
      - ShortName
      - MD5
      - SHA1
      - FirstBytes
      - OwnerId
      - OwnerSid
      - Owner
      - Version
      - CompanyName
      - ProductName
      - OriginalFileName
      - Platform
      - TimeStamp
      - SubSystem
      - FileType
      - FileOS
      - FilenameFlags
      - SHA256
      - PeSHA1
      - PeSHA256
      - SecDescrID
      - EASize
      - SecurityDirectory
      - AuthenticodeStatus
      - AuthenticodeSigner
      - AuthenticodeSignerThumbprint
      - AuthenticodeCA
      - AuthenticodeCAThumbprint
      - PeMD5
      - FilenameIndex
      - DataIndex
      - SnapshotID
      - SSDeep
      - TLSH
      - SignedHash
      - SecurityDirectorySize
      - SecurityDirectorySignatureSize
