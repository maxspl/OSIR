metadata:
  version: "1.0"
  id: NTFSInfo_i30
  author: Typ
  description: Windows NTFS Filename-only CSV (NTFSInfo i30) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.action:
        value: ntfs_filename
      event.provider:
        value: Windows NTFS Filename (detail)

  - set:
      file.name: Name
      file.size:
        source: DataSize
        operation: to_int
      host.name: ComputerName

  # $FILE_NAME attribute timestamps, ECS-style naming on the fn_* attributes:
  # fn_created, fn_mtime, fn_accessed, fn_ctime (attribute/metadata change)
  - set:
      file.fn_created:
        source: FileNameCreationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameCreationDate) && .FileNameCreationDate != ""

  - set:
      file.fn_mtime:
        source: FileNameLastModificationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameLastModificationDate) && .FileNameLastModificationDate != ""

  - set:
      file.fn_accessed:
        source: FileNameLastAccessDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameLastAccessDate) && .FileNameLastAccessDate != ""

  - set:
      file.fn_ctime:
        source: FileNameLastAttrModificationDate
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FileNameLastAttrModificationDate) && .FileNameLastAttrModificationDate != ""

  # complementary info: action.properties, not event
  - set:
      action.properties.VolumeID: VolumeID
      action.properties.FRN: FRN
      action.properties.ParentFRN: ParentFRN
      action.properties.FilenameFlags: FilenameFlags
      action.properties.SnapshotID: SnapshotID
      action.properties.CarvedEntry: CarvedEntry

  # primary timestamp: FN last modification, FN creation as fallback
  - custom: |2-
      ts_value = null
      ts_source = null
      if exists(.file.fn_mtime) {
          ts_value = .file.fn_mtime
          ts_source = "fn_mtime"
      } else if exists(.file.fn_created) {
          ts_value = .file.fn_created
          ts_source = "fn_created"
      }
      if ts_value != null {
          .timestamp = ts_value
          if !exists(.event.created) {
              .event.created = ts_value
          }
          .action.properties.timestamp_source = ts_source
      }

  - delete:
      - ComputerName
      - VolumeID
      - CarvedEntry
      - FRN
      - ParentFRN
      - Name
      - FilenameFlags
      - FileNameCreationDate
      - FileNameLastModificationDate
      - FileNameLastAccessDate
      - FileNameLastAttrModificationDate
      - SnapshotID
      - DataSize
