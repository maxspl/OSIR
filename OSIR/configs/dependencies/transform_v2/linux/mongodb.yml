metadata:
  version: "1.0"
  id: mongodb
  author: Typ
  description: OSIR - MongoDB log normalizer

transformation:
  - custom: |2-
      if exists(.t) {
          t_val, err = get(.t, ["$date"])
          if t_val != null {
              .timestamp = t_val
          }
          del(.t)
      }

      if exists(.s) {
          s_val = del(.s)
          if s_val != null {
              s_str = to_string!(s_val)
              .event.severity = if s_str == "F" {
                  "fatal"
              } else if s_str == "E" {
                  "error"
              } else if s_str == "W" {
                  "warning"
              } else if s_str == "I" {
                  "informational"
              } else if starts_with(s_str, "D") {
                  "debug" + " " + s_str
              } else {
                  s_str
              }
          }
      }

      if exists(.c) {
          c_val = del(.c)
          if c_val != null {
              .event.kind = to_string!(c_val)
          }
      }

      if exists(.id) {
          id_val = del(.id)
          if id_val != null {
              .event.id = id_val
          }
      }

      if exists(.ctx) {
          ctx_val = del(.ctx)
          if ctx_val != null {
              .event.context = to_string!(ctx_val)
          }
      }

      if exists(.svc) {
          svc_val = del(.svc)
          if svc_val != null {
              .service.name = to_string!(svc_val)
          }
      }

      if exists(.msg) {
          msg_val = del(.msg)
          if msg_val != null {
              .message = to_string!(msg_val)
          }
      }

      if exists(.attr) {
          attr_val = del(.attr)
          if attr_val != null {
              .log = attr_val
          }
      }

      if exists(.log.remote) {
          remote_val = to_string!(.log.remote)
          parts = split(remote_val, ":")
          if length(parts) == 2 {
              .source.address = remote_val
              .source.ip = parts[0]
              .source.port = to_int!(parts[1])
          }
          del(.log.remote)
      }

      if exists(.log.uuid.uuid) {
          uuid_val, err = get(.log.uuid.uuid, ["$uuid"])
          if uuid_val != null {
              .log.uuid = to_string!(uuid_val)
          }
          del(.log.uuid.uuid)
      }

      if exists(.tags) {
          tags_val = del(.tags)
          if tags_val != null {
              .log.tags = tags_val
          }
      }

      if exists(.truncated) {
          truncated_val = del(.truncated)
          if truncated_val != null {
              .log.truncated = truncated_val
          }
      }

      if exists(.size) {
          size_val = del(.size)
          if size_val != null {
              .log.size = size_val
          }
      }
