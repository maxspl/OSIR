metadata:
  version: "1.0"
  author: maxspl
  description: Static name resolution from /etc/hosts
  os: unix

configuration:
  module: hosts
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: generic_hosts

splunk:
  'linux:hosts':
    name_rex: \.jsonl$
    path_suffix: hosts
    sourcetype: 'linux:hosts'
    host_rex: ([\w\.-]+?)--
    artifact: "hosts"
