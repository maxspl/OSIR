metadata:
  version: "1.0"
  id: loki
  author: Typ
  description: Loki-RS ECS normalization

transformation:
  - set:
      event.original: encode_json!(.)
    conditions:
      - field: event.original
        exists: false
  - set:
      event.module:
        value: loki
      observer.vendor:
        value: Nextron Systems
      observer.product:
        value: Loki-RS
      observer.type:
        value: scanner
  # timestamp: reformatted only when the %+ format parses
  - set:
      timestamp: 'format_timestamp!(parse_timestamp!(to_string!(.timestamp), format: "%+"), format: "%Y-%m-%dT%H:%M:%SZ")'
    filter: '(parse_timestamp(to_string!(.timestamp), format: "%+") ?? null) != null'
  - set:
      observer.hostname: to_string!(.hostname)
    filter: 'exists(.hostname) && (to_string(.hostname) ?? "") != ""'
  - set:
      log.level: downcase!(to_string!(.level))
  - set:
      event.severity:
        value: 90
    conditions:
      - field: log.level
        value: alert
  - set:
      event.severity:
        value: 70
    conditions:
      - field: log.level
        value: warning
  - set:
      event.severity:
        value: 50
    conditions:
      - field: log.level
        value: notice
  - set:
      event.severity:
        value: 40
    conditions:
      - field: log.level
        value: error
  - set:
      event.severity:
        value: 10
    filter: '!exists(.event.severity) && exists(.log.level)'
  - set:
      message: to_string(.message) ?? null
  - set:
      event.risk_score: 'to_int(to_float(.score) ?? 0.0)'
      loki.score: 'to_int(to_float(.score) ?? 0.0)'
    filter: 'exists(.score) && (to_float(.score) ?? null) != null'
  # event type categorization (default: scan-info)
  - set:
      event_type_lower: 'downcase(to_string(.event_type) ?? "info")'
  - set:
      event.kind:
        value: alert
      event.category:
        value: [file, malware]
      event.type:
        value: [info]
      event.action:
        value: loki-file-match
      event.dataset:
        value: loki.filescan
    conditions:
      - field: event_type_lower
        value: file_match
  - set:
      event.kind:
        value: alert
      event.category:
        value: [process, malware]
      event.type:
        value: [info]
      event.action:
        value: loki-process-match
      event.dataset:
        value: loki.processcheck
    conditions:
      - field: event_type_lower
        value: process_match
  - set:
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [start]
      event.action:
        value: loki-scan-start
      event.dataset:
        value: loki.scan
    conditions:
      - field: event_type_lower
        value: scan_start
  - set:
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [end]
      event.action:
        value: loki-scan-end
      event.dataset:
        value: loki.scan
    conditions:
      - field: event_type_lower
        value: scan_end
  - set:
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [error]
      event.action:
        value: loki-scan-error
      event.dataset:
        value: loki.scan
    conditions:
      - field: event_type_lower
        value: error
  - set:
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [info]
      event.action:
        value: loki-scan-info
      event.dataset:
        value: loki.scan
    filter: '!exists(.event.kind)'
  - delete:
      - event_type_lower
  - set:
      file.path: to_string(.file_path) ?? null
      file.name: basename!(to_string!(.file_path))
    filter: 'exists(.file_path) && (to_string(.file_path) ?? "") != ""'
  - set:
      file.extension: 'downcase!(to_string!(split(basename!(to_string!(.file_path)), ".")[-1]))'
    filter: 'exists(.file_path) && (to_string(.file_path) ?? "") != "" && length(split(basename!(to_string!(.file_path)), ".")) > 1'
  - set:
      file.type: to_string(.file_type) ?? null
  - set:
      file.size: 'to_int(.file_size) ?? null'
    filter: 'exists(.file_size) && (to_int(.file_size) ?? null) != null'
  - set:
      file.hash.md5: to_string(.md5) ?? null
      file.hash.sha1: to_string(.sha1) ?? null
      file.hash.sha256: to_string(.sha256) ?? null
      file.created: to_string(.file_created) ?? null
      file.mtime: to_string(.file_modified) ?? null
      file.accessed: to_string(.file_accessed) ?? null
  - set:
      process.pid: 'to_int(.pid) ?? null'
    filter: 'exists(.pid) && (to_int(.pid) ?? null) != null'
  - set:
      process.name: to_string(.process_name) ?? null
  - set:
      process.start: 'format_timestamp!(from_unix_timestamp!(to_int!(.start_time)), format: "%Y-%m-%dT%H:%M:%SZ")'
    filter: 'exists(.start_time) && (to_int(.start_time) ?? null) != null'
  - set:
      loki.process.run_time: to_string(.run_time) ?? null
  - set:
      loki.process.memory_bytes: 'to_int(.memory_bytes) ?? null'
    filter: 'exists(.memory_bytes) && (to_int(.memory_bytes) ?? null) != null'
  - set:
      loki.process.cpu_usage: 'to_float(.cpu_usage) ?? null'
    filter: 'exists(.cpu_usage) && (to_float(.cpu_usage) ?? null) != null'
  - set:
      loki.process.connection_count: 'to_int(.connection_count) ?? null'
    filter: 'exists(.connection_count) && (to_int(.connection_count) ?? null) != null'
  - set:
      loki.process.listening_ports: listening_ports
  - custom: |2-
      if exists(.reasons) {
          reasons = array(.reasons) ?? []
          .loki.reasons_count = length(reasons)

          if length(reasons) > 0 {
              primary = object(reasons[0]) ?? {}

              if exists(primary.message) {
                  reason_message = to_string(primary.message) ?? ""
                  .event.reason = reason_message

                  if starts_with(reason_message, "YARA match with rule ") {
                      .rule.name = replace(reason_message, "YARA match with rule ", "")
                      .rule.ruleset = "yara"
                  } else if starts_with(reason_message, "HASH match with IOC HASH: ") {
                      .rule.name = replace(reason_message, "HASH match with IOC HASH: ", "")
                      .rule.ruleset = "hash_ioc"
                  } else if starts_with(reason_message, "File Name IOC matched PATTERN: ") {
                      .rule.name = replace(reason_message, "File Name IOC matched PATTERN: ", "")
                      .rule.ruleset = "filename_ioc"
                  } else {
                      .rule.name = reason_message
                      .rule.ruleset = "loki"
                  }
              }

              if exists(primary.score) {
                  primary_score = to_int(primary.score) ?? null
                  if primary_score != null {
                      .rule.risk_score = primary_score
                  }
              }

              if exists(primary.description) {
                  .rule.description = to_string(primary.description) ?? null
              }

              if exists(primary.author) {
                  .rule.author = [to_string!(primary.author)]
              }

              if exists(primary.reference) {
                  .rule.reference = to_string(primary.reference) ?? null
              }

              if exists(primary.matched_strings) {
                  .loki.primary.matched_strings = primary.matched_strings
              }
          }

          .loki.reasons = reasons
      }
  - set:
      loki.context: context
  - delete:
      - hostname
      - level
      - event_type
      - score
      - file_path
      - file_type
      - file_size
      - md5
      - sha1
      - sha256
      - file_created
      - file_modified
      - file_accessed
      - pid
      - process_name
      - start_time
      - run_time
      - memory_bytes
      - cpu_usage
      - connection_count
      - listening_ports
      - reasons
      - context
