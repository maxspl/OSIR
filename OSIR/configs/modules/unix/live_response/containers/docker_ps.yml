metadata:
  version: "1.0"
  author: maxspl
  description: Docker containers, running and stopped
  os: unix

configuration:
  module: docker_ps
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --asciitable | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/docker_container_ls.*\.txt$"
    - r"\/docker_ps.*\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/containers"
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:live_response:containers:docker_ps':
    name_rex: --docker_ps-.*\.jsonl$
    path_suffix: containers
    sourcetype: 'linux:live_response:containers:docker_ps'
    host_rex: ([\w\.-]+?)--
    artifact: docker_ps
