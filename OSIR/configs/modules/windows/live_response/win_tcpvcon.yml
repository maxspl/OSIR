metadata:
  version: "2.0"
  author: maxspl
  description: Parse routes.txt from DFIR ORC (Tcpvcon.exe -a -n -c command)
  os: windows

configuration:
  module: win_tcpvcon
  alt_module: live_response_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  name: Tcpvcon.txt
  path: extracted_files/General/

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"/Endpoint_(.*?)/"
      default: "UNKNOWN"

optional:
  parser: tcpvcon

splunk:
  'windows:live_response:win_tcpvcon':
    name_rex: r"--win_tcpvcon\.jsonl$"
    path_suffix: win_tcpvcon 
    host_rex: r"([\w\.-]+)--"
    artifact: "TCPVCON"
    normalize:
      - ecs_normalize/windows/live_response/tcpvcon.vrl 
