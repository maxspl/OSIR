metadata:
  version: "1.0"
  author: maxspl
  description: Kelly Brazil - JsonConverter - Parsing the output of the command ss.
    UAC collects ss rather than netstat on modern distributions.
  os: unix

configuration:
  module: ss
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --ss | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/ss_-anp\.txt$"
    - r"\/ss_-ap\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/network"
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:live_response:network:ss':
    name_rex: ss.*\.jsonl$
    path_suffix: network
    sourcetype: 'linux:live_response:network:ss'
    host_rex: ([\w\.-]+?)--
    artifact: ss
