metadata:
  version: "1.0"
  id: shimcache
  author: Typ
  description: Windows ShimCache / AppCompatCache (AppCompatCacheParser CSV) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.dataset:
        value: windows.shimcache
      event.module:
        value: windows
      event.kind:
        value: event
      event.category:
        value: [file]
      event.type:
        value: [info]
      event.provider:
        value: "Windows AppCompatCache (ShimCache)"
      event.outcome:
        value: success

  # -- AppCompatCacheParser (Zimmerman) input ------------------------------------

  # ControlSet, CacheEntryPosition, Path, LastModifiedTimeUTC, Executed,
  # Duplicate, SourceFile
  - set:
      file.path: Path
      file.mtime:
        source: LastModifiedTimeUTC
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      timestamp:
        source: LastModifiedTimeUTC
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.control_set:
        source: ControlSet
        operation: to_int
      labels.cache_entry_position:
        source: CacheEntryPosition
        operation: to_int
      labels.executed:
        source: Executed
        operation: to_bool
      labels.duplicate:
        source: Duplicate
        operation: to_bool
      labels.source_file: SourceFile
    filter: exists(.Path) && exists(.CacheEntryPosition)

  - delete:
      - ControlSet
      - CacheEntryPosition
      - Path
      - LastModifiedTimeUTC
      - Executed
      - Duplicate
      - SourceFile

timeline:
  - id: shimcache-entry
    message: "ShimCache entry exists for {file.path}"
    conditions:
      - field: file.path
        exists: true

relationships:
  - id: shimcache-entry
    source: file.path
    target: labels.executed
    type: executed
