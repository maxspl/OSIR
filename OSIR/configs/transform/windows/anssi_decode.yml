metadata:
  version: "1.0"
  id: anssi_decode
  author: Typ
  description: ANSSI decode (decode_result_C.csv) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.provider:
        value: ANSSI decode

  # -- decode_result_C.csv input --------------------------------------------------
  # (hashes may be empty or "NaN" when the tool could not compute them)

  - set:
      host.name: ComputerName
      action.properties.computer_name: ComputerName
      action.properties.volume_id: VolumeID
      action.properties.volume_info: VolumeInfo
      action.properties.snapshot_id: SnapshotID
      file.path: FullPath
      file.directory: ParentName
      action.properties.parent_name: ParentName
      file.name: File
      file.attributes: Attributes
      action.properties.attributes_raw: Attributes
      pe.file_version: Version
      action.properties.original_file_name: OriginalFileName
      action.properties.platform: Platform
      action.properties.subsystem: SubSystem
      action.properties.file_type: FileType
      action.properties.file_os: FileOS
      action.properties.signer_thumbprint: AuthenticodeSignerThumbprint
      action.properties.ca_thumbprint: AuthenticodeCAThumbprint
      action.properties.filename_creation_date: FileNameCreationDate
      action.properties.filename_last_modification_date: FileNameLastModificationDate
      action.properties.filename_last_access_date: FileNameLastAccessDate
      action.properties.filename_last_attr_modification_date: FileNameLastAttrModificationDate
      action.properties.analysis_flag: Analysis
      action.properties.isolated: Isolated
      action.properties.isolated_pval: isolated_pval
      action.properties.features: Features
      action.properties.path_model: Path
      action.properties.path_pval: path_pval
      action.properties.if_features_pval: if_features_pval
      action.properties.db_features: db_features
      action.properties.features_core_pnt: features_core_pnt
      action.properties.db_features_pval: db_features_pval
      action.properties.features_pval: features_pval
      action.properties.final_score: final_score
      action.properties.warning_in_listdlls: WarningInListDLLs

  - set:
      file.extension:
        source: 'downcase(replace(to_string!(.Extension), pattern: ".", with: ""))'
    filter: exists(.Extension) && .Extension != ""

  - set:
      file.size:
        source: SizeInBytes
        operation: to_int

  - set:
      file.created:
        source: CreationDate
        operation: parse_timestamp
        parameters:
          format: "%+"
    filter: exists(.CreationDate) && .CreationDate != ""

  - set:
      file.mtime:
        source: LastModificationDate
        operation: parse_timestamp
        parameters:
          format: "%+"
    filter: exists(.LastModificationDate) && .LastModificationDate != ""

  - set:
      file.accessed:
        source: LastAccessDate
        operation: parse_timestamp
        parameters:
          format: "%+"
    filter: exists(.LastAccessDate) && .LastAccessDate != ""

  - set:
      action.properties.last_attr_change:
        source: LastAttrChangeDate
        operation: parse_timestamp
        parameters:
          format: "%+"
    filter: exists(.LastAttrChangeDate) && .LastAttrChangeDate != ""

  - set:
      hash.sha1: SHA1
    filter: exists(.SHA1) && .SHA1 != "" && .SHA1 != "NaN"

  - set:
      action.properties.sha1: PeSHA1
    filter: exists(.PeSHA1) && .PeSHA1 != "" && .PeSHA1 != "NaN"

  - set:
      action.properties.sha256: PeSHA256
    filter: exists(.PeSHA256) && .PeSHA256 != "" && .PeSHA256 != "NaN"

  - set:
      action.properties.md5: PeMD5
    filter: exists(.PeMD5) && .PeMD5 != "" && .PeMD5 != "NaN"

  - set:
      action.properties.signed_hash: SignedHash
    filter: exists(.SignedHash) && .SignedHash != "" && .SignedHash != "NaN"

  - set:
      action.properties.timestamp:
        source: TimeStamp
        operation: parse_timestamp
        parameters:
          format: "%+"
    filter: exists(.TimeStamp) && .TimeStamp != ""

  - set:
      code_signature.status: AuthenticodeStatus
      action.properties.status_raw: AuthenticodeStatus

  - set:
      code_signature.subject_name: AuthenticodeSigner

  - set:
      code_signature.issuer_name: AuthenticodeCA

  - set:
      code_signature.exists:
        value: true
    filter: exists(.code_signature.subject_name) || exists(.code_signature.issuer_name)

  - set:
      action.properties.files_created_same_time:
        source: FilesCreatedAtSameTime
        operation: to_int

  - delete:
      - ComputerName
      - VolumeID
      - VolumeInfo
      - SnapshotID
      - FullPath
      - ParentName
      - File
      - Extension
      - SizeInBytes
      - Attributes
      - CreationDate
      - LastModificationDate
      - LastAccessDate
      - LastAttrChangeDate
      - FileNameCreationDate
      - FileNameLastModificationDate
      - FileNameLastAccessDate
      - FileNameLastAttrModificationDate
      - SHA1
      - PeSHA1
      - PeSHA256
      - PeMD5
      - SignedHash
      - Version
      - OriginalFileName
      - Platform
      - TimeStamp
      - SubSystem
      - FileType
      - FileOS
      - AuthenticodeStatus
      - AuthenticodeSigner
      - AuthenticodeCA
      - AuthenticodeSignerThumbprint
      - AuthenticodeCAThumbprint
      - FilesCreatedAtSameTime
      - Analysis
      - Isolated
      - isolated_pval
      - Features
      - Path
      - path_pval
      - if_features_pval
      - db_features
      - features_core_pnt
      - db_features_pval
      - features_pval
      - final_score
      - WarningInListDLLs
