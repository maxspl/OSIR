metadata:
  version: "1.0"
  id: srum
  author: Typ
  description: Windows SRUM (Artemis JSONL + dfir-ogre SRUM JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.dataset:
        value: windows.srum
      event.module:
        value: windows
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [info]
      event.provider:
        value: "Windows System Resource Usage Monitor (SRUM)"
      event.outcome:
        value: success

  # -- Artemis input ---------------------------------------------------------------

  # auto_inc_id, timestamp, app_id, user_id, facetime, foreground_*/background_*
  - set:
      timestamp:
        source: timestamp
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      labels.incremental_id:
        source: auto_inc_id
        operation: to_int
      labels.app_id: app_id
      user.id: user_id
      labels.face_time:
        source: facetime
        operation: to_int
      labels.foreground_cycle_time:
        source: foreground_cycle_time
        operation: to_int
      labels.background_cycle_time:
        source: background_cycle_time
        operation: to_int
      labels.foreground_context_switches:
        source: foreground_context_switches
        operation: to_int
      labels.background_context_switches:
        source: background_context_switches
        operation: to_int
      labels.foreground_bytes_read:
        source: foreground_bytes_read
        operation: to_int
      labels.foreground_bytes_written:
        source: foreground_bytes_written
        operation: to_int
      labels.background_bytes_read:
        source: background_bytes_read
        operation: to_int
      labels.background_bytes_written:
        source: background_bytes_written
        operation: to_int
      labels.foreground_num_read_operations:
        source: foreground_num_read_operations
        operation: to_int
      labels.foreground_num_write_operations:
        source: foreground_num_write_options
        operation: to_int
      labels.background_num_read_operations:
        source: background_num_read_operations
        operation: to_int
      labels.background_num_write_operations:
        source: background_num_write_operations
        operation: to_int
      labels.foreground_number_of_flushes:
        source: foreground_number_of_flushes
        operation: to_int
      labels.background_number_of_flushes:
        source: background_number_of_flushes
        operation: to_int
      labels.collection_metadata: collection_metadata
    filter: exists(.auto_inc_id) && exists(.app_id)

  # -- OGRE (dfir-ogre SRUM) input --------------------------------------------------

  # incremental_id, timestamp, app_id, user_id, face_time,
  # foreground_*/background_*, ogre_md
  - set:
      timestamp:
        source: timestamp
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      labels.incremental_id:
        source: incremental_id
        operation: to_int
      labels.app_id: app_id
      user.id: user_id
      labels.face_time:
        source: face_time
        operation: to_int
      labels.foreground_cycle_time:
        source: foreground_cycle_time
        operation: to_int
      labels.background_cycle_time:
        source: background_cycle_time
        operation: to_int
      labels.foreground_context_switches:
        source: foreground_context_switches
        operation: to_int
      labels.background_context_switches:
        source: background_context_switches
        operation: to_int
      labels.foreground_bytes_read:
        source: foreground_bytes_read
        operation: to_int
      labels.foreground_bytes_written:
        source: foreground_bytes_written
        operation: to_int
      labels.background_bytes_read:
        source: background_bytes_read
        operation: to_int
      labels.background_bytes_written:
        source: background_bytes_written
        operation: to_int
      labels.foreground_num_read_operations:
        source: foreground_num_read_operations
        operation: to_int
      labels.foreground_num_write_operations:
        source: foreground_num_write_operations
        operation: to_int
      labels.background_num_read_operations:
        source: background_num_read_operations
        operation: to_int
      labels.background_num_write_operations:
        source: background_num_write_operations
        operation: to_int
      labels.foreground_number_of_flushes:
        source: foreground_number_of_flushes
        operation: to_int
      labels.background_number_of_flushes:
        source: background_number_of_flushes
        operation: to_int
    filter: exists(.incremental_id) && exists(.app_id)

  - delete:
      - auto_inc_id
      - incremental_id
      - timestamp
      - app_id
      - user_id
      - facetime
      - face_time
      - foreground_cycle_time
      - background_cycle_time
      - foreground_context_switches
      - background_context_switches
      - foreground_bytes_read
      - foreground_bytes_written
      - background_bytes_read
      - background_bytes_written
      - foreground_num_read_operations
      - foreground_num_write_options
      - foreground_num_write_operations
      - background_num_read_operations
      - background_num_write_operations
      - foreground_number_of_flushes
      - background_number_of_flushes
      - collection_metadata
      - ogre_md

timeline:
  - id: app-usage
    message: "Application {labels.app_id} was used by user {user.id}"
    conditions:
      - field: labels.app_id
        exists: true

relationships:
  - id: app-usage
    source: user.id
    target: labels.app_id
    type: used
