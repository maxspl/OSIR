metadata:
  version: "2.0"
  author: Eric Zimmerman
  description: Eric Zimmerman - PECmd.exe
  os: windows

configuration:
  module: prefetch_orc
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: windows

tool: 
  path: net9/PECmd.exe
  cmd: -d "{input_dir}" --json "{output_dir}" --jsonf "{output_filename}" -q
  source: https://ericzimmerman.github.io/
  version: 1.5.1

input:
  type: file
  name: \.pf_{
  path: Prefetch

output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"/Endpoint_(.*?)/"
      default: "UNKNOWN"

splunk:
  'windows:prefetch':
    name_rex: r"\.jsonl$"
    path_suffix: 'prefetch'
    sourcetype: 'windows:files:prefetch'
    host_rex: r"([\w\.-]+)--"
    timestamp_path: 
        - "LastRun"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    artifact: "Prefetch"
