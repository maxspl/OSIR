metadata:
  version: "1.0"
  id: amcache
  author: Typ
  description: Amcache artifacts (AmcacheParser CSV + dfir-ogre Amcache.hve JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.dataset:
        value: windows.amcache
      event.module:
        value: windows
      event.kind:
        value: event
      event.category:
        value: [file, driver, device]
      event.type:
        value: [info]
      event.provider:
        value: "Windows AmCache"
      event.outcome:
        value: success

  # -- AmcacheParser (Zimmerman) input ----------------------------------------

  # UnassociatedFileEntries: FullPath, Name, SHA1, Size, LinkDate, ...
  - set:
      timestamp:
        source: FileKeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.mtime:
        source: FileKeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.hive:
        value: Amcache
      file.path: FullPath
      file.name: Name
      file.size:
        source: Size
        operation: to_int
      file.extension: FileExtension
      file.hash.sha1: SHA1
      file.description: Description
      file.version: Version
      file.mtime:
        source: LinkDate
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.application_name: ApplicationName
      labels.program_id: ProgramId
      labels.is_os_component:
        source: IsOsComponent
        operation: to_bool
      labels.is_pe_file:
        source: IsPeFile
        operation: to_bool
      labels.binary_type: BinaryType
      labels.product_name: ProductName
      labels.product_version: ProductVersion
      labels.bin_file_version: BinFileVersion
      labels.bin_product_version: BinProductVersion
      labels.long_path_hash: LongPathHash
      labels.usn:
        source: Usn
        operation: to_int
      labels.language: Language
      labels.original_file_name: OriginalFileName
    filter: exists(.FullPath)

  # DeviceContainers: KeyName, FriendlyName, Manufacturer, ModelId, ...
  - set:
      timestamp:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.mtime:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.hive:
        value: Amcache
      labels.key_name: KeyName
      device.manufacturer: Manufacturer
      device.model.name: ModelName
      labels.model_number: ModelNumber
      labels.model_id: ModelId
      labels.friendly_name: FriendlyName
      labels.categories: Categories
      labels.primary_category: PrimaryCategory
      labels.discovery_method: DiscoveryMethod
      labels.icon: Icon
      labels.is_active:
        source: IsActive
        operation: to_bool
      labels.is_connected:
        source: IsConnected
        operation: to_bool
      labels.is_machine_container:
        source: IsMachineContainer
        operation: to_bool
      labels.is_networked:
        source: IsNetworked
        operation: to_bool
      labels.is_paired:
        source: IsPaired
        operation: to_bool
      labels.state:
        source: State
        operation: to_int
    filter: exists(.ModelId)

  # DevicePnps: HWID, Class, DriverName, DriverVerDate, ...
  - set:
      timestamp:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.mtime:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.hive:
        value: Amcache
      labels.key_name: KeyName
      labels.bus_reported_description: BusReportedDescription
      labels.class: Class
      labels.class_guid: ClassGuid
      labels.compid: Compid
      labels.container_id: ContainerId
      labels.description: Description
      labels.driver_id: DriverId
      labels.driver_name: DriverName
      labels.driver_ver_date:
        source: DriverVerDate
        operation: parse_timestamp
        parameters:
          format: "%m-%d-%Y"
      labels.driver_ver_version: DriverVerVersion
      labels.enumerator: Enumerator
      labels.hwid: HWID
      labels.inf: Inf
      labels.install_state:
        source: InstallState
        operation: to_int
      labels.manufacturer: Manufacturer
      labels.matching_id: MatchingId
      labels.model: Model
      labels.parent_id: ParentId
      labels.problem_code:
        source: ProblemCode
        operation: to_int
      labels.provider: Provider
      labels.service: Service
      labels.stackid: Stackid
    filter: exists(.HWID)

  # DriveBinaries: DriverCheckSum, DriverSigned, ImageSize, ...
  - set:
      timestamp:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.mtime:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.hive:
        value: Amcache
      labels.key_name: KeyName
      labels.driver_time_stamp:
        source: DriverTimeStamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.driver_last_write_time:
        source: DriverLastWriteTime
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.driver_name: DriverName
      labels.driver_in_box:
        source: DriverInBox
        operation: to_bool
      labels.driver_is_kernel_mode:
        source: DriverIsKernelMode
        operation: to_bool
      labels.driver_signed:
        source: DriverSigned
        operation: to_bool
      labels.driver_check_sum: DriverCheckSum
      labels.driver_company: DriverCompany
      labels.driver_id: DriverId
      labels.driver_package_strong_name: DriverPackageStrongName
      labels.driver_type: DriverType
      labels.driver_version: DriverVersion
      labels.image_size:
        source: ImageSize
        operation: to_int
      labels.inf: Inf
      labels.product: Product
      labels.product_version: ProductVersion
      labels.service: Service
      labels.wdf_version: WdfVersion
    filter: exists(.DriverCheckSum)

  # DriverPackages: SubmissionId, SYSFILE, Hwids, ...
  - set:
      timestamp:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.mtime:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.hive:
        value: Amcache
      labels.key_name: KeyName
      labels.date:
        source: Date
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      labels.class: Class
      labels.directory: Directory
      labels.driver_in_box:
        source: DriverInBox
        operation: to_bool
      labels.hwids: Hwids
      labels.inf: Inf
      labels.provider: Provider
      labels.submission_id: SubmissionId
      labels.sysfile: SYSFILE
      labels.version: Version
    filter: exists(.SubmissionId)

  # ShortCuts: LnkName
  - set:
      timestamp:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.mtime:
        source: KeyLastWriteTimestamp
        operation: parse_timestamp
        parameters:
          format: "%F %T"
      registry.hive:
        value: Amcache
      labels.key_name: KeyName
      file.path: LnkName
    filter: exists(.LnkName)

  # -- OGRE (dfir-ogre hive Amcache) input ------------------------------------

  # registry value records: path, name, data, type, size, mtime, ...
  - set:
      registry.hive:
        value: Amcache
      registry.path:
        source: 'replace(to_string!(.path), pattern: "\\\\", with: "\\")'
      registry.value: name
      registry.data.type: type
      labels.value_data: data
      timestamp:
        source: mtime
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      registry.mtime:
        source: mtime
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      labels.value_size:
        source: size
        operation: to_int
      labels.is_placeholder:
        source: is_placeholder
        operation: to_bool
    filter: exists(.path) && exists(.mtime)

  - delete:
      - ApplicationName
      - ProgramId
      - FileKeyLastWriteTimestamp
      - SHA1
      - IsOsComponent
      - FullPath
      - Name
      - FileExtension
      - LinkDate
      - ProductName
      - Size
      - Version
      - ProductVersion
      - LongPathHash
      - BinaryType
      - IsPeFile
      - BinFileVersion
      - BinProductVersion
      - Usn
      - Language
      - Description
      - OriginalFileName
      - KeyName
      - KeyLastWriteTimestamp
      - Categories
      - DiscoveryMethod
      - FriendlyName
      - Icon
      - IsActive
      - IsConnected
      - IsMachineContainer
      - IsNetworked
      - IsPaired
      - Manufacturer
      - ModelId
      - ModelName
      - ModelNumber
      - PrimaryCategory
      - State
      - BusReportedDescription
      - Class
      - ClassGuid
      - Compid
      - ContainerId
      - DriverId
      - DriverPackageStrongName
      - DriverName
      - DriverVerDate
      - DriverVerVersion
      - Enumerator
      - HWID
      - Inf
      - InstallState
      - MatchingId
      - Model
      - ParentId
      - ProblemCode
      - Provider
      - Service
      - Stackid
      - DriverTimeStamp
      - DriverLastWriteTime
      - DriverInBox
      - DriverIsKernelMode
      - DriverSigned
      - DriverCheckSum
      - DriverCompany
      - DriverType
      - DriverVersion
      - ImageSize
      - Product
      - WdfVersion
      - Date
      - Directory
      - Hwids
      - SubmissionId
      - SYSFILE
      - LnkName
      - path
      - mtime
      - name
      - data
      - type
      - size
      - is_placeholder
      - ogre_md

timeline:
  - id: file-entry
    message: "Amcache file entry exists for {file.path} (SHA1 {file.hash.sha1})"
    conditions:
      - field: file.path
        exists: true

  - id: device-connected
    message: "Device {labels.friendly_name} was connected"
    conditions:
      - field: labels.is_connected
        value: true

relationships:
  - id: file-entry
    source: file.path
    target: file.hash.sha1
    type: hashed as
