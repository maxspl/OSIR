metadata:
  version: "1.0"
  author: maxspl
  description: Kelly Brazil - JsonConverter - Parsing the output of the command systemctl
    list-units
  os: unix

configuration:
  module: systemctl_lu
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --systemctl | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/systemctl_list-units\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/system"
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:live_response:system:systemctl_lu':
    name_rex: --systemctl_lu-.*\.jsonl$
    path_suffix: system
    sourcetype: 'linux:live_response:system:systemctl_lu'
    host_rex: ([\w\.-]+?)--
    artifact: systemctl_lu
