metadata:
  version: "1.0"
  author: maxspl
  description: Configured apt repositories
  os: unix

configuration:
  module: apt_sources
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_apt_sources

splunk:
  'linux:apt_sources':
    name_rex: \.jsonl$
    path_suffix: apt_sources
    sourcetype: 'linux:apt_sources'
    host_rex: ([\w\.-]+?)--
    artifact: "apt_sources"
