metadata:
  version: "2.0"
  author: Typ
  description: Parse webserver access,certificates,error,hosts,logs from UAC [root] using Dissect plugin
  os: windows

configuration:
  module: webserver
  alt_module: dissect_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  plugin: webserver

splunk:
  'linux:webserver':
    name_rex: r"\.jsonl$"
    path_suffix: webserver
    sourcetype: 'linux:webserver'
    host_rex: r"([\w\.-]+?)--"
    timestamp_path: 
        - "ts"
    timestamp_format: "%Y-%m-%dT%H:%M:%S.%f%z"
    artifact: "webserver"
