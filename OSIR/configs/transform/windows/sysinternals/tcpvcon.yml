metadata:
  version: "1.0"
  id: tcpvcon
  author: Typ
  description: Sysinternals Tcpvcon (ORC live response JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.provider:
        value: Sysinternals Tcpvcon
      network.protocol:
        value: ip

  # type, protocol, process_name, pid, state, local_address, remote_address
  - set:
      action.properties.type: type

  - set:
      network.transport:
        source: protocol
        operation: downcase
      network.protocol:
        source: protocol
        operation: downcase

  - set:
      process.name: process_name
      process.pid:
        source: pid
        operation: to_int

  - set:
      action.properties.tcp_state: state

  - set:
      network.direction:
        value: ingress
    filter: 'exists(.state) && downcase!(to_string!(.state)) == "listening"'

  - set:
      source.ip: local_address
    filter: exists(.local_address) && .local_address != ""

  - set:
      destination.ip: remote_address
    filter: exists(.remote_address) && .remote_address != ""

  - set:
      network.type:
        value: ipv4
    filter: '(exists(.source.ip) && !contains(to_string!(.source.ip), ":")) || (exists(.destination.ip) && !contains(to_string!(.destination.ip), ":"))'

  - set:
      network.type:
        value: ipv6
    filter: '(exists(.source.ip) && contains(to_string!(.source.ip), ":")) || (exists(.destination.ip) && contains(to_string!(.destination.ip), ":"))'

  - delete:
      - type
      - protocol
      - process_name
      - pid
      - state
      - local_address
      - remote_address
