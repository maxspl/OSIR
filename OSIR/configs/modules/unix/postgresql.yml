metadata:
  version: "2.0"
  author: Typ
  description: Parsing logs from '/var/log/postgresql'
  os: unix

configuration:
  module: postgresql
  type: process
  disk_only: true
  no_multithread: true
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  name: (?:postgresql)
  path: var/log/postgresql

output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:postgres':
    name_rex: r"\.jsonl$"
    path_suffix: postgresql
    sourcetype: 'linux:postgres'
    host_rex: r"([\w\.-]+?)--"
    timestamp_path: 
        - "_time"
    timestamp_format: "%s"
    artifact: "postgres"
