metadata:
  version: "2.0"
  author: Typ
  description: Parsing of $MFT artifact.
  os: windows

configuration:
  module: mft
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: windows

tool: 
  path: net9/MFTECmd.exe
  cmd: -f '{input_file}' --csv '{output_dir}' --csvf '{output_filename}'
  source: https://ericzimmerman.github.io/
  version: 1.3

input:
  type: file
  paths: 
    - r"\$MFT$"
    - r"\$J$"

output:
  type: single_file
  format: csv
  filename: "{extracted_endpoint}--{input_file}-{module}.csv"

extracted:
  - endpoint:
      patterns:
        - r"restore_fs\/(.*?)\/"
        - r"/Endpoint_(.*?)/"
      default: "UNKNOWN"

splunk:
  'filesystem:ntfs:info':
    name_rex: r"\$MFT.*\.csv$"
    sourcetype: 'eztools:filesystem:ntfs:info'
    host_rex: r"([\w\.-]+)--"
    timestamp_path:
      - "timestamp" 
    timestamp_format: "%Y-%m-%d %H:%M:%S%.f"
    artifact: "mft"
    normalize:
      - .vrl/windows/zimmerman/mft.vrl
  'filesystem:ntfs:usn':
    name_rex: r"\$J.*.csv$"
    sourcetype: 'eztools:filesystem:ntfs:usn'
    host_rex: r"([\w\.-]+)--"
    timestamp_path: 
        - "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S.%f"
    normalize:
      - .vrl/windows/zimmerman/usn.vrl
