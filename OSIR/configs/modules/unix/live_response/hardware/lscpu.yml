metadata:
  version: "2.0"
  author: Kelly Brazil
  description: Kelly Brazil - JsonConverter - Parsing the output of the command lscpu
  os: unix

configuration:
  module: lscpu
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool: 
  path: cat
  cmd: "{input_file} | jc --kv | jq -c '.' > {output_file}"

input:
  type: file
  paths: 
    - r"lscpu.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/hardware"
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:live_response:hardware:lscpu':
    name_rex: r"lscpu.*\.jsonl$"
    sourcetype: 'linux:live_response:hardware:lscpu'
    host_rex: r"([\w\.-]+?)--"
    artifact: lscpu
