metadata:
  version: "2.0"
  author: Typ
  description: Parse osinfo from UAC [root] using Dissect plugin
  os: unix

configuration:
  module: osinfo
  alt_module: dissect_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  plugin: osinfo

splunk:
  'linux:osinfo':
    name_rex: r"\.jsonl$"
    path_suffix: osinfo
    sourcetype: 'linux:osinfo'
    host_rex: r"([\w\.-]+?)--"
    artifact: "osinfo"
