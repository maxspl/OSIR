metadata:
  version: "1.0"
  author: maxspl
  description: at.allow and at.deny access control
  os: unix

configuration:
  module: at_acl
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_at_acl

splunk:
  'linux:at_acl':
    name_rex: \.jsonl$
    path_suffix: at_acl
    sourcetype: 'linux:at_acl'
    host_rex: ([\w\.-]+?)--
    artifact: "at_acl"
