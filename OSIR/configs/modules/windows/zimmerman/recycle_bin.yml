metadata:
  version: "2.0"
  author: maxspl
  description: Parsing of recycle bin artifact.
  os: windows

configuration:
  module: recycle_bin
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: windows

tool: 
  path: net9/RBCmd.exe
  cmd: -d '{input_dir}' --csv "{output_dir}" --csvf "{output_filename}" -q 
  source: https://github.com/EricZimmerman/RBCmd
  version: 1.6.0

input:
  type: dir
  path: $Recycle.Bin

output:
  type: single_file
  format: csv
  filename: "{extracted_endpoint}--{module}.csv"

extracted:
  - endpoint:
      patterns:
        - r"restore_fs\/(.*?)\/"
      default: "UNKNOWN"

splunk:
  'windows:recyclebin':
    name_rex: r"\.csv$"
    path_suffix: 'recycle_bin'
    sourcetype: 'windows:files:recyclebin'
    host_rex: r"([\w\.-]+)--"
    timestamp_path: 
        - "timestamp"
    timestamp_format: "%Y-%m-%dT%H:%M:%SZ"
    normalize:
      - ecs_normalize/windows/recycle_bin.vrl
