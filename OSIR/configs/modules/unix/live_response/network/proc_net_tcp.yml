metadata:
  version: "1.0"
  author: maxspl
  description: TCP sockets read from /proc/net/tcp, complements ss
  os: unix

configuration:
  module: proc_net_tcp
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --proc-net-tcp | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/proc_net_tcp6?\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/network"
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:live_response:network:proc_net_tcp':
    name_rex: --proc_net_tcp-.*\.jsonl$
    path_suffix: network
    sourcetype: 'linux:live_response:network:proc_net_tcp'
    host_rex: ([\w\.-]+?)--
    artifact: proc_net_tcp
