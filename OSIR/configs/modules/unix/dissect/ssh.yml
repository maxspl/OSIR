metadata:
  version: "2.0"
  author: Typ
  description: Parse ssh authorized_keys,known_hosts,private_keys,public_keys,config,session from UAC [root] using Dissect plugin
  os: unix

configuration:
  module: ssh
  alt_module: dissect_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  plugin: ssh

splunk:
  'linux:ssh':
    name_rex: r"\.jsonl$"
    path_suffix: ssh
    sourcetype: 'linux:ssh'
    host_rex: r"([\w\.-]+?)--"
    artifact: "ssh"
