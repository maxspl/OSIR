metadata:
  version: "1.0"
  author: maxspl
  description: Parsing of usninfo - using ANSSI DFIR OGRE
  os: windows

configuration:
  module: ogre-usn-info
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
    - external
  processor_os: unix

tool: 
  path: /app/ogre-venv/bin/dfir-ogre
  cmd: >-
    plugin
    --filename "{input_file}"
    --computer_name "{extracted_endpoint}"
    --output_folder "{output_dir}"
    --plugin_config "/ogre/dfir-ogre-plugin-windows/configuration/usn_info.xml"
    --output_format jsonl
    --output_date_format iso_utc
  source: https://github.com/ANSSI-FR/dfir-ogre
  version: 2.0.0-beta1

input:
  type: file
  paths:
    - r"USNInfo.*\.csv$"

output:
  type: multiple_files
  format: jsonl
  output_prefix: "{extracted_endpoint}--{module}-"

extracted:
  - endpoint:
      patterns:
        - r"restore_fs\/(.*?)\/"
        - r"\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'filesystem:ntfs:usn':
    name_rex: r"\.jsonl$"
    path_suffix: 'ogre-usn-info'
    sourcetype: 'ogre:filesystem:ntfs:usn'
    host_rex: r"([\w\.-]+)--"
    artifact: "USN"
    timestamp_path:
      - "timestamp"
    timestamp_format: "%Y-%m-%dT%H:%M:%SZ"
    normalize:
      - .vrl/windows/dfir-ogre/usn_info.vrl
