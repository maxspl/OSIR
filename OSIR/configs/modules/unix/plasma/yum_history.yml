metadata:
  version: "1.0"
  author: maxspl
  description: Package history from the yum/dnf log
  os: unix

configuration:
  module: yum_history
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_yum_history

splunk:
  'linux:yum_history':
    name_rex: \.jsonl$
    path_suffix: yum_history
    sourcetype: 'linux:yum_history'
    host_rex: ([\w\.-]+?)--
    timestamp_path:
        - "hist_time"
    artifact: "yum_history"
