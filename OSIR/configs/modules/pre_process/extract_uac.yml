metadata:
  version: "3.0"
  author: Typ,maxspl
  description: Used to execute internal pre-processing for Unix Artefact Collector
    Capture
  os: unix

configuration:
  module: extract_uac
  type: pre-process
  disk_only: true
  no_multithread: true
  processor_type:
  - internal
  processor_os: unix

tool: 
  path: 7zz
  version: 24.07
  # {m_*} placeholders are resolved by the module itself
  cmd: x -o{m_output_dir} -y {m_input_file} -p"{m_password}"

input:
  type: file
  paths:
    - uac-*.tar.gz
    - uac-*.zip

output:
  type: multiple_files
  format: raw

optional:
  # Optional password for encrypted UAC zip archives
  # Leave empty to let the module recover it from the sibling UAC .log file
  password:

endpoint: 
  patterns:
    - r"(?:.*[\\/])?[^-]+-(.*)-[^-]+-[^-]+$"
  default: "UNKNOWN"
