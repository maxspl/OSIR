metadata:
  version: "1.0"
  id: shell_bags
  author: Typ
  description: Windows ShellBags CSV (SBECmd) → ECS

transformation:
  # -- SBECmd (Zimmerman) CSV input ------------------------------------------

  - set:
      timestamp: 
        source: LastWriteTime
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastWriteTime) && .LastWriteTime != ""

  - set:
      timestamp: 
        source: FirstInteracted
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.FirstInteracted) && .FirstInteracted != ""

  - set: 
      timestamp: 
        source: LastInteracted
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
    filter: exists(.LastInteracted) && .LastInteracted != ""

  - set:
      labels.bag_path: BagPath
      labels.absolute_path: AbsolutePath
      labels.shell_type: ShellType
      labels.value: Value


  - set:
      labels.misc: Miscellaneous
    filter: exists(.Miscellaneous) && .Miscellaneous != ""

  - set:
      file.name: Value
    filter: .labels.shell_type == "File"

  - set:
      file.directory: Value
    filter: .labels.shell_type == "Directory"

  - set:
      labels.slot:
        source: Slot
        operation: to_int
      labels.node_slot:
        source: NodeSlot
        operation: to_int
      labels.mru_position:
        source: MRUPosition
        operation: to_int
      labels.child_bags:
        source: ChildBags
        operation: to_int
      labels.mft_sequence:
        source: MFTSequenceNumber
        operation: to_int
      labels.extension_block_count:
        source: ExtensionBlockCount
        operation: to_int
      labels.has_explored:
        source: HasExplored
        operation: to_bool
      labels.last_write_time:
        source: LastWriteTime
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
      labels.first_interacted:
        source: FirstInteracted
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
      labels.last_interacted:
        source: LastInteracted
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"

  - set:
      file.created:
        source: CreatedOn
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
      file.mtime:
        source: ModifiedOn
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
      file.accessed:
        source: AccessedOn
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
      file.inode:
        source: MFTEntry
        operation: to_int

  - set:
      registry.hive:
        value: HKCU
      registry.mtime:
        source: LastWriteTime
        operation: parse_timestamp
        parameters:
          format: "%F %T%.f"
      registry.path:
        source: '"HKCU\\Local Settings\\Software\\Microsoft\\Windows\\Shell\\" + replace(to_string!(.BagPath), pattern: "\\\\", with: "\\")'

  # -- OGRE (dfir-ogre registry shell_bag plugin) input ----------------------

  - set:
      labels.value: name
      labels.shell_type: type
      labels.localized_name: localized_name
      labels.description: description
      labels.key_security: key_security
      file.inode: file_reference

  - set:
      labels.absolute_path:
        source: 'replace(to_string!(.path), pattern: "\\\\", with: "\\")'
    filter: exists(.path)

  - set:
      timestamp:
        source: key_modif_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      registry.mtime:
        source: key_modif_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      file.mtime:
        source: modification_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      file.accessed:
        source: access_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
      file.created:
        source: creation_time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"

  - set:
      registry.path:
        source: 'replace(to_string!(.key_path), pattern: "\\\\", with: "\\")'
    filter: exists(.key_path)

  # OGRE entries have no HasExplored source: default to true, but only
  # when the SBECmd flavour has not set the label already
  - set:
      labels.has_explored:
        value: true
    filter: '!exists(.labels.has_explored)'

  - delete:
      - BagPath
      - AbsolutePath
      - ShellType
      - Value
      - Miscellaneous
      - Slot
      - NodeSlot
      - MRUPosition
      - ChildBags
      - MFTSequenceNumber
      - ExtensionBlockCount
      - MFTEntry
      - CreatedOn
      - ModifiedOn
      - AccessedOn
      - LastWriteTime
      - FirstInteracted
      - LastInteracted
      - HasExplored
      - name
      - type
      - path
      - file_reference
      - modification_time
      - access_time
      - creation_time
      - key_path
      - key_modif_time
      - key_security
      - ogre_md
      - localized_name
      - description

timeline:
  - id: interacted-with
    message: "User {user.name} interacted with {labels.absolute_path}"
    conditions:
      - field: labels.has_explored
        value: true

  - id: referenced
    message: "Shellbag entry exists for {labels.absolute_path} (no evidence of user interaction)"
    conditions:
      - field: labels.has_explored
        value: false

relationships:
  - id: interacted-with
    source: user.name
    target: labels.value
    type: interacted with

  - id: referenced
    source: user.name
    target: labels.value
    type: referenced