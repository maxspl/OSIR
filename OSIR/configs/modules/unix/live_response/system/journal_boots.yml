metadata:
  version: "1.0"
  author: maxspl
  description: Boot sessions recorded by the systemd journal
  os: unix

configuration:
  module: journal_boots
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - external
  processor_os: unix

tool:
  path: cat
  cmd: "{input_file} | jc --asciitable | jq -c '.[]' > {output_file}"

input:
  type: file
  paths:
    - r"\/journalctl_--list-boots\.txt$"

output:
  type: single_file
  format: jsonl
  output_dir: "{case_path}/live_response/system"
  output_file: "{endpoint_name}--{module}-{input_file}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

splunk:
  'linux:live_response:system:journal_boots':
    name_rex: --journal_boots-.*\.jsonl$
    path_suffix: system
    sourcetype: 'linux:live_response:system:journal_boots'
    host_rex: ([\w\.-]+?)--
    artifact: journal_boots
