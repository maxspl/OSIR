metadata:
  version: "2.0"
  author: Typ
  description: Parsing logs from '/var/log/debug'
  os: unix

configuration:
  module: debug
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: file
  path: var/log
  name: (?:debug)

output:
  type: single_file
  format: json
  filename: '{extracted_endpoint}--{module}-{input_file}.jsonl'

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:debug':
    name_rex: r"\.jsonl$"
    path_suffix: debug
    sourcetype: 'linux:debug'
    host_rex: r"([\w\.-]+?)--"
    artifact: "debug"
