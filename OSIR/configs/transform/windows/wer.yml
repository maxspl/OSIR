metadata:
  version: "2.0"
  id: wer
  author: Typ
  description: Windows Error Reporting (WER) (.wer files) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.provider:
        value: "Windows Error Reporting (WER)"

  # -- event type -> event.code ------------------------------------------------------
  - custom: |2-
      if exists(.EventType) {
          event_type = to_string!(del(.EventType))
          .event.code = event_type
          event_type_l = downcase(event_type)
          if event_type_l == "appcrash" || event_type_l == "bex" || contains(event_type_l, "failureinfo") {
              .event.type = ["error"]
              .log.level = "error"
          } else {
              .event.type = ["info"]
          }
      }

      if exists(.IsFatal) {
          is_fatal = to_string!(del(.IsFatal))
          if is_fatal == "1" || is_fatal == "4294967295" {
              .event.outcome = "failure"
              .event.severity = 3
          }
      }
  # -- timestamps (FILETIME) ---------------------------------------------------------
  - custom: |2-
      windows_epoch_seconds = 11644473600

      if exists(.EventTime) {
          ft_raw = to_int!(del(.EventTime))
          unix_sec = to_int(ft_raw / 10000000) - windows_epoch_seconds
          ts = from_unix_timestamp!(unix_sec)
          .timestamp = ts
          .event.created = ts
      }

      if exists(.UploadTime) {
          ft_raw = to_int!(del(.UploadTime))
          unix_sec = to_int(ft_raw / 10000000) - windows_epoch_seconds
          .event.ingested = from_unix_timestamp!(unix_sec)
      }
  # -- process -----------------------------------------------------------------------
  - custom: |2-
      if exists(.AppName) {
          .process.name = to_string!(del(.AppName))
      } else if exists(.NsAppName) {
          .process.name = to_string!(del(.NsAppName))
      } else if exists(.PS_Application_name) {
          .process.name = to_string!(del(.PS_Application_name))
      } else if exists(.PS_Application_Name) {
          .process.name = to_string!(del(.PS_Application_Name))
      } else if exists(."PS_Nom_de_l’application") {
          .process.name = to_string!(del(."PS_Nom_de_l’application"))
      }

      if exists(.AppPath) {
          .process.executable = to_string!(del(.AppPath))
      }

      if exists(."UI[2]") {
          .process.command_line = to_string!(del(."UI[2]"))
      }
  - set:
      process.pe.original_file_name: OriginalFilename
      process.entity_id: ApplicationIdentity
      process.session_leader.id: AppSessionGuid
      host.boot.id: BootId
      event.reason: FriendlyEventName
      message: ReportDescription
      log.file.path: _file
  # -- error signature (PS_*) --------------------------------------------------------
  - custom: |2-
      if exists(.PS_Message) {
          .error.message = to_string!(del(.PS_Message))
      }

      if exists(."PS_Code_de_l’exception") {
          .error.code = to_string!(del(."PS_Code_de_l’exception"))
      } else if exists(.PS_Exception_Code) {
          .error.code = to_string!(del(.PS_Exception_Code))
      } else if exists(.PS_Error_Code) {
          .error.code = to_string!(del(.PS_Error_Code))
      } else if exists(.PS_Code) {
          .error.code = to_string!(del(.PS_Code))
      }

      if exists(."PS_Nom_du_module_défaillant") {
          .error.culprit = to_string!(del(."PS_Nom_du_module_défaillant"))
      } else if exists(.PS_Fault_Module_Name) {
          .error.culprit = to_string!(del(.PS_Fault_Module_Name))
      }

      if exists(.PS_Application_Version) {
          .process.pe.file_version = to_string!(del(.PS_Application_Version))
      } else if exists(."PS_Version_de_l’application") {
          .process.pe.file_version = to_string!(del(."PS_Version_de_l’application"))
      }
  # -- os_info -----------------------------------------------------------------------
  - custom: |2-
      os = null

      if exists(.os_info) {
          os = del(.os_info)
      }

      if os != null {
          .host.os.type = "windows"
          .host.os.name = "Windows"

          if exists(os.osver) {
              .host.os.version = to_string!(os.osver)
          }
          if exists(os.verbld) {
              .host.os.build = to_string!(os.verbld)
          }
          if exists(os.edition) {
              .host.os.full = "Windows " + to_string!(os.edition)
          }
          if exists(os.osver) && contains(to_string!(os.osver), "amd64") {
              .host.architecture = "x86_64"
          }

          .action.properties.os_info = os
      }

      if exists(."PS_Version_du_système_d’exploitation") {
          .host.os.version = to_string!(del(."PS_Version_du_système_d’exploitation"))
      } else if exists(.PS_OsVersion) {
          .host.os.version = to_string!(del(.PS_OsVersion))
      } else if exists(.PS_OSVersion) {
          .host.os.version = to_string!(del(.PS_OSVersion))
      }
  # every remaining WER field moves verbatim to action.properties:
  # PS_* signatures, Ns[*], File[*], ProcessMetadata[*], UI[*], Response +
  # Response.*, consent/report/target/wow64 identifiers, state,
  # dynamic_signatures, ...
  - custom: |2-
      known = ["event", "action", "user", "host", "process", "file", "log", "error", "message", "timestamp", "OriginalFilename", "ApplicationIdentity", "AppSessionGuid", "BootId", "FriendlyEventName", "ReportDescription", "_file"]
      rest = .
      ap = {}
      for_each(keys(rest)) -> |_, k| {
          if !includes(known, k) {
              v = get!(rest, [k])
              ap = set!(ap, [k], v)
              rest = remove!(rest, [k])
          }
      }
      . = rest
      .action.properties = merge(object(.action.properties) ?? {}, ap)

  - delete:
      - OriginalFilename
      - ApplicationIdentity
      - AppSessionGuid
      - BootId
      - FriendlyEventName
      - ReportDescription
      - _file
