metadata:
  version: "1.0"
  author: maxspl
  description: logrotate configuration
  os: unix

configuration:
  module: logrotate
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  filename: "{extracted_endpoint}--{module}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

optional:
  dissector: linux_logrotate

splunk:
  'linux:logrotate':
    name_rex: r"\.jsonl$"
    path_suffix: logrotate
    sourcetype: 'linux:logrotate'
    host_rex: r"([\w\.-]+?)--"
    artifact: "logrotate"
