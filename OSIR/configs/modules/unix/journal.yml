metadata:
  version: "2.0"
  author: Typ
  description: Parsing logs from '/var/log/journal/'
  os: unix

configuration:
  module: journal
  type: process
  disk_only: true
  no_multithread: true
  processor_type:
  - external
  processor_os: unix

tool: 
  path: journalctl
  cmd: --file={input_file} --output=json > {output_file}

input:
  type: file
  name: (?:system|user)
  path: var/log/journal/*

output:
  type: single_file
  format: json
  filename: "{extracted_endpoint}--{module}-{input_file}.jsonl"

extracted:
  - endpoint:
      patterns:
        - r"extract_uac\/Endpoint_(.*?)\/"
      default: "UNKNOWN"

splunk:
  'linux:journal':
    name_rex: r"\.jsonl$"
    path_suffix: journal
    sourcetype: 'linux:journal'
    host_rex: r"([\w\.-]+?)--"
    timestamp_path: 
        - "__REALTIME_TIMESTAMP"
    artifact: "journal"
