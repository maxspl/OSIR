metadata:
  version: "1.0"
  id: pstree_roots
  author: Typ
  description: Windows live response – process tree roots → ECS

transformation:
  - set:
      event.dataset:
        value: windows.pstree_live_response
      event.module:
        value: windows
      event.kind:
        value: event
      event.category:
        value: [process]
      event.type:
        value: [info]
      event.action:
        value: process_tree_root
      event.outcome:
        value: success
  - custom: |2-
      if exists(.tree_id) {
          tree_id_val = to_int(.tree_id) ?? null

          if tree_id_val != null {
              .pstree.tree_id = tree_id_val
          } else {
              .pstree.tree_id_raw = to_string!(.tree_id)
          }

          del(.tree_id)
      }

      if exists(.root_pid) {
          root_pid_val = to_int(.root_pid) ?? null

          if root_pid_val != null {
              .process.pid      = root_pid_val
              .pstree.root_pid  = root_pid_val
          } else {
              .pstree.root_pid_raw = to_string!(.root_pid)
          }

          del(.root_pid)
      }

      if exists(.root_exe) {
          exe = to_string!(del(.root_exe))

          if exe != "" {
              .process.executable = exe
              .process.name       = exe      # for roots, exe == name (no path)
              .pstree.root_exe    = exe
          }
      }

      if exists(.root_time) {
          rt_raw = to_string!(del(.root_time))

          ts = parse_timestamp(rt_raw, format: "%+") ?? null

          if ts != null {
              .timestamp      = ts
              .event.created  = ts
              .process.start  = ts
              .pstree.root_time = ts
          } else if rt_raw != "" {
              .pstree.root_time_raw = rt_raw
          }
      }
