master:
  host: {master_host} # If windows machine is remote but master and agent are on the same host, specify the IP used by Windows IP to connect master 
splunk:
  host: {splunk_host}
  user: {splunk_user}
  password: {splunk_password}
  port: {splunk_port}
  mport: {splunk_mport}
  ssl: {splunk_ssl}
elasticsearch:
  host: {es_host}
  user: {es_user}
  password: {es_password}
  port: {es_port}
  ssl: {es_ssl}
  kibana_port: {kibana_port} # Kibana web interface port (display only, used by the web sidebar link)
windows_box:
  location: {windows_box_location}
  cores: {windows_box_cores}
  remote_box:
    host: {windows_box_remote_box_host}
    user: {windows_box_remote_box_user}
    password: {windows_box_remote_box_password}
    custom_mountpoint: {windows_box_remote_box_custom_mountpoint}
