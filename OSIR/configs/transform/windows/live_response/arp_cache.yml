metadata:
  version: "1.0"
  id: arp_cache
  author: Typ
  description: Windows ARP Cache (live response JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.provider:
        value: Windows ARP Cache
      network.protocol:
        value: arp
      network.type:
        value: ipv4

  # -- live response ARP cache input ---------------------------------------------
  # type, interface_ip, interface_index, ip_address, mac_address, entry_type
  # (entry_type is localized: dynamique / statique on a French Windows)

  - set:
      action.properties.type: type
      source.ip: interface_ip
      host.ip:
        source: '[to_string!(.interface_ip)]'
      action.properties.interface_index: interface_index

  - set:
      destination.ip: ip_address
    filter: exists(.ip_address) && .ip_address != ""

  - set:
      destination.mac:
        source: 'downcase(replace(to_string!(.mac_address), "-", ":"))'
    filter: exists(.mac_address) && .mac_address != ""

  - set:
      network.type:
        value: ipv6
    filter: exists(.ip_address) && contains(to_string!(.ip_address), ":")

  - set:
      action.properties.entry_type_raw: entry_type

  - translate:
      mapping:
        action.properties.entry_type: entry_type
      dictionary:
        "dynamique": dynamic
        "statique": static
      fallback: unknown

  - delete:
      - type
      - interface_ip
      - interface_index
      - ip_address
      - mac_address
      - entry_type
