metadata:
  version: "1.0"
  author: maxspl
  description: systemd timer unit definitions
  os: unix

configuration:
  module: systemd_timer
  alt_module: plasma_dispatcher
  type: process
  disk_only: false
  no_multithread: false
  processor_type:
  - internal
  processor_os: unix

input:
  type: dir
  paths:
    - r"extract_uac.*\/\[root\]$"

output:
  type: single_file
  format: jsonl
  output_file: "{endpoint_name}--{module}.jsonl"

endpoint:
  patterns:
    - r"extract_uac\/Endpoint_(.*?)\/"
  default: "UNKNOWN"

optional:
  dissector: linux_systemd_timer

splunk:
  'linux:systemd_timer':
    name_rex: \.jsonl$
    path_suffix: systemd_timer
    sourcetype: 'linux:systemd_timer'
    host_rex: ([\w\.-]+?)--
    artifact: "systemd_timer"
