      user.target.id: Event.EventData.TargetUserSid
  - set:
      url.domain: split!(.Event.EventData.url, r'/')[0]
    filter: exists(.Event.EventData.url) && !starts_with(to_string!(.Event.EventData.url), "http")
  - set:
      url.domain: split!(.Event.EventData.RemoteName, r'/')[0]
    filter: exists(.Event.EventData.RemoteName) && !starts_with(to_string!(.Event.EventData.RemoteName), "http")
  - set:
      package.name: split!(.Event.EventData.LmPackageName, " ")[0]
      package.description:
        value: LAN Manager package
    filter: exists(.Event.EventData.LmPackageName) && .Event.EventData.LmPackageName != "-"
  - set:
      package.version: split!(.Event.EventData.LmPackageName, " ")[-1]
    filter: exists(.Event.EventData.LmPackageName) && length(split!(.Event.EventData.LmPackageName, " ")) > 1
  - set:
      process.name: split!(.Event.EventData.Application, "\\")[-1]
    filter: exists(.Event.EventData.Application)
  - set:
      process.executable: Event.EventData.NewProcessName
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-Security-Auditing" && includes([4688, 4689], .event.id)
  - set:
      process.executable: Event.EventData.ProcessName
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-Security-Auditing" && includes([4656, 4657, 4658, 4663, 4670, 4674], .event.id)
  - set:
      process.executable: Event.EventData.ImageLoaded
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-Sysmon" && .event.id == 6
  - set:
      process.executable: Event.EventData.SourceImage
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-Sysmon" && includes([8, 10], .event.id)
  - set:
      process.executable: Event.EventData.ProcessName
    filter: '!exists(.process.executable) && .Event.EventData.ProcessName != "-"'
  - set:
      log.level: downcase(to_string(.log.level) ?? "")
    filter: exists(.log.level)
  - set:
      process.command_line: replace(to_string(.process.command_line) ?? "", "\"", "")
    filter: exists(.process.command_line)
  - set:
      process.parent.command_line: replace(to_string(.process.parent.command_line) ?? "", "\"", "")
    filter: exists(.process.parent.command_line)
  - set:
      process.pe.imphash: downcase(to_string(.process.pe.imphash) ?? "")
    filter: exists(.process.pe.imphash)
  - set:
      process.hash.md5: downcase(to_string(.process.hash.md5) ?? "")
    filter: exists(.process.hash.md5)
  - set:
      process.hash.sha1: downcase(to_string(.process.hash.sha1) ?? "")
    filter: exists(.process.hash.sha1)
  - set:
      process.hash.sha256: downcase(to_string(.process.hash.sha256) ?? "")
    filter: exists(.process.hash.sha256)
  - set:
      file.pe.imphash: downcase(to_string(.file.pe.imphash) ?? "")
    filter: exists(.file.pe.imphash)
  - set:
      file.hash.md5: downcase(to_string(.file.hash.md5) ?? "")
    filter: exists(.file.hash.md5)
  - set:
      file.hash.sha256: downcase(to_string(.file.hash.sha256) ?? "")
    filter: exists(.file.hash.sha256)
  - set:
      dll.hash.imphash: downcase(to_string(.dll.pe.imphash) ?? "")
      dll.pe.imphash: downcase(to_string(.dll.pe.imphash) ?? "")
    filter: exists(.dll.pe.imphash)
  - set:
      dll.hash.md5: downcase(to_string(.dll.hash.md5) ?? "")
    filter: exists(.dll.hash.md5)
  - set:
      dll.hash.sha256: downcase(to_string(.dll.hash.sha256) ?? "")
    filter: exists(.dll.hash.sha256)
  - set:
      process.parent.command_line: process.parent.executable
    filter: exists(.process.parent.command_line) && exists(.process.parent.executable) && downcase(to_string(.process.parent.command_line) ?? "") == downcase(to_string(.process.parent.executable) ?? "")
  - set:
      source.size_in_char: length(to_string(.source.domain) ?? "")
    filter: exists(.source.domain)
  - set:
      destination.size_in_char: length(to_string(.destination.domain) ?? "")
    filter: exists(.destination.domain)
  - set:
      process.name: replace(to_string(.process.executable) ?? "", r'^.*[\\/]', "")
    filter: exists(.process.executable) && !exists(.process.name)
  - set:
      process.working_directory: replace(to_string(.process.executable) ?? "", r'[^\\/]*$', "")
    filter: exists(.process.executable) && !exists(.process.working_directory)
  - set:
      process.parent.name: replace(to_string(.process.parent.executable) ?? "", r'^.*[\\/]', "")
    filter: exists(.process.parent.executable) && !exists(.process.parent.name)
  - set:
      process.parent.working_directory: replace(to_string(.process.parent.executable) ?? "", r'[^\\/]*$', "")
    filter: exists(.process.parent.executable) && !exists(.process.parent.working_directory)
  - set:
      process.name:
        value: powershell.exe
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-PowerShell"
  - set:
      file.size:
        value: '-1'
    filter: is_float(.Event.EventData.fileLength) || (to_string(.Event.EventData.fileLength) ?? "") == "18446744073709551615"
  - set:
      dns.question.name: Event.EventData.QueryName
      dns.response_code: Event.EventData.QueryStatus
  - set:
      dns.type:
        value: query
    filter: exists(.Event.EventData.QueryName)
  - set:
      dns.type:
        value: answer
    filter: exists(.Event.EventData.QueryResults)
  - set:
      dns.size_in_char: length(to_string(.dns.question.name) ?? "")
    filter: exists(.dns.question.name)
  - set:
      registry.data.strings: '[to_string(.Event.EventData.Details) ?? ""]'
  - set:
      registry.path: Event.EventData.TargetObject
      registry.hive: split!(.Event.EventData.TargetObject, "\\")[0]
      registry.key: join!(slice!(split!(.Event.EventData.TargetObject, "\\"), 1, -1), "\\")
      registry.value: split!(.Event.EventData.TargetObject, "\\")[-1]
    filter: exists(.Event.EventData.TargetObject)
  - set:
      registry.data.type:
        value: STRING
      registry.data.strings: '[replace(to_string(.Event.EventData.Details) ?? "", r''^"|"$'', "")]'
    filter: exists(.Event.EventData.Details) && starts_with(to_string!(.Event.EventData.Details), "\"")
  - set:
      registry.data.type: split!(to_string!(.Event.EventData.Details), " ")[0]
    filter: exists(.Event.EventData.Details) && ends_with(to_string!(.Event.EventData.Details), ")")
  - translate:
      mapping:
        registry.data.type: registry.data.type
      dictionary:
        DWORD: REG_DWORD
        STRING: REG_SZ
      fallback: REG_NONE
    filter: exists(.registry.data.type)
  - custom: |2-
      .parse_url = parse_url(to_string(.url.original) ?? "") ?? {}
    filter: exists(.url.original)
  - set:
      url.full: url.original
      url.domain: parse_url.host
      url.scheme: parse_url.scheme
      url.path: parse_url.path
    filter: exists(.url.original) && starts_with(to_string!(.url.original), "http")
  - set:
      network.type:
        value: ipv6
    filter: (to_string(.Event.EventData.SourceIsIpv6) ?? "") == "true"
  - set:
      network.type:
        value: ipv4
    filter: (to_string(.Event.EventData.SourceIsIpv6) ?? "") == "false"
  - set:
      process.pe.imphash: parsed_hashes_kv.IMPHASH
    filter: '!includes([7, 15, 23, 24, 26], .event.id)'
  - set:
      process.pe.imphash: parsed_hashes_kv_2.IMPHASH
    filter: '!includes([7, 15, 23, 24, 26], .event.id) && !exists(.process.pe.imphash)'
  - set:
      process.hash.sha1: parsed_hashes_kv.SHA1
    filter: '!includes([7, 15, 23, 24, 26], .event.id)'
  - set:
      process.hash.sha1: parsed_hashes_kv_2.SHA1
    filter: '!includes([7, 15, 23, 24, 26], .event.id) && !exists(.process.hash.sha1)'
  - set:
      process.hash.md5: parsed_hashes_kv.MD5
    filter: '!includes([7, 15, 23, 24, 26], .event.id)'
  - set:
      process.hash.md5: parsed_hashes_kv_2.MD5
    filter: '!includes([7, 15, 23, 24, 26], .event.id) && !exists(.process.hash.md5)'
  - set:
      process.hash.sha256: parsed_hashes_kv.SHA256
    filter: '!includes([7, 15, 23, 24, 26], .event.id)'
  - set:
      process.hash.sha256: parsed_hashes_kv_2.SHA256
    filter: '!includes([7, 15, 23, 24, 26], .event.id) && !exists(.process.hash.sha256)'
  - set:
      process.pid: Event.EventData.ProcessID
  - set:
      process.pid: Event.EventData.ProcessId
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-Sysmon" && includes([1,2,3,5,7,9,11,12,13,14,15,17,18,22,25,26], .event.id)
  - set:
      process.pid: Event.EventData.SourceProcessId
    filter: .Event.System.Provider."#attributes".Name == "Microsoft-Windows-Sysmon" && includes([8, 10], .event.id)
  - set:
      process.pid: parse_int!(.Event.EventData.NewProcessId)
      process.parent.pid: parse_int!(.Event.EventData.ProcessId)
    filter: .event.provider == "Microsoft-Windows-Security-Auditing" && includes([4688, 4689], .event.id) && starts_with(to_string(.Event.EventData.NewProcessId) ?? "", "0x")
  - set:
      process.pid: parse_int!(.Event.EventData.ProcessId)
    filter: .event.provider == "Microsoft-Windows-Security-Auditing" && !includes([4688, 4689], .event.id) && !exists(.process.pid) && starts_with(to_string(.Event.EventData.ProcessId) ?? "", "0x")
  - set:
      process.id: process.pid
    filter: exists(.process.pid)
  - set:
      process.thread.id: Event.EventData.ThreadID
  - set:
      user.name: action.properties.Param1
      user.domain: action.properties.Param2
    filter: .action.type == "Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational" && .event.id == 1149
  - custom: |2-
      user_candidates = compact([
        .action.properties.User,
        .action.properties.AccountName,
        .action.properties.Requester,
        .action.properties.UserName,
        .action.properties.Username,
        .action.properties.PrincipalSamName
      ])
      user_candidates = filter(user_candidates) -> |_i, v| { is_string(v) && v != "-" && v != "NULL" }
      if length(user_candidates) > 0 {
        .user.name = user_candidates[0]
      }
    filter: '!exists(.user.name)'
  - set:
      user.id: user.name
    filter: exists(.user.name) && !exists(.user.id) && starts_with(to_string(.user.name) ?? "", "S-1-")
  - custom: |2-
      del(.user.name)
    filter: exists(.user.name) && starts_with(to_string(.user.name) ?? "", "S-1-")
  - set:
      user.domain: split!(.user.name, "\\")[0]
      user.name: split!(.user.name, "\\")[1]
    filter: exists(.user.name) && contains(to_string(.user.name) ?? "", "\\")
  - set:
      user.domain: Event.EventData.Domain
    filter: exists(.user.name) && !exists(.user.domain)
  - set:
      user.domain: Event.System.Computer
    filter: exists(.user.name) && !exists(.user.domain)
  - set:
      user.name: action.properties.SubjectUserName
      user.domain: action.properties.SubjectDomainName
    filter: '!exists(.user.name)'
  - set:
      user.id: action.properties.SubjectUserSid
    filter: '!exists(.user.id)'
  - set:
      user.id: action.properties.UserSid
    filter: '!exists(.user.id)'
  - set:
      user.id: action.properties.SID
    filter: '!exists(.user.id)'
  - set:
      user.id: .Event.System.Security."#attributes".UserID
    filter: '!exists(.user.id) && !exists(.user.name)'
  - custom: |2-
      ip_candidates = [
        .Event.EventData.IpAddress,
        .Event.EventData.SourceIp,
        .Event.EventData.SourceAddress,
        .Event.EventData.SourceAddr,
        .Event.EventData.SourceNetworkAddress,
        .Event.EventData.NetworkAddress,
        .Event.EventData.ClientAddress,
        .Event.EventData.ClientIP,
        .action.properties.Address
      ]
      if .action.type == "Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational" && .event.id == 1149 {
        ip_candidates = push(ip_candidates, .action.properties.Param3)
      }
      ips = []
      for_each(ip_candidates) -> |_i, v| {
        ip = replace(to_string(v) ?? "", r'^::ffff:', "")
        # "1.2.3.4:3389" / "[::1]:3389"
        ip_port = parse_regex(ip, r'^\[?(?P<ip>[0-9a-fA-F:.]+?)\]?:(?P<port>\d+)$') ?? {}
        if !is_ipv6(ip) && exists(ip_port.ip) {
          ip = string!(ip_port.ip)
          if !exists(.source.port) { .source.port = ip_port.port }
        }
        if is_ipv4(ip) || is_ipv6(ip) {
          ips = push(ips, ip)
        }
      }
      if length(ips) > 0 {
        .source.ip = ips[0]
        .source.address = ips[0]
      }
    filter: '!exists(.source.ip)'
  - set:
      source.port: Event.EventData.IpPort
    filter: '!exists(.source.port) && exists(.source.ip) && !includes(["-", "0"], .Event.EventData.IpPort)'
  - set:
      source.domain: Event.EventData.WorkstationName
    filter: '!exists(.source.domain) && !includes(["-", ""], .Event.EventData.WorkstationName)'
  - set:
      source.address: source.domain
    filter: '!exists(.source.address) && exists(.source.domain)'
  - set:
      source.ip: Event.EventData.CallingStationID
    filter: is_ipv4(to_string(.Event.EventData.CallingStationID) ?? "") || is_ipv6(to_string(.Event.EventData.CallingStationID) ?? "")
  - set:
      source.mac: Event.EventData.CallingStationID
    filter: '!exists(.source.ip) && .Event.EventData.CallingStationID != "-"'
  - set:
      destination.ip: Event.EventData.AuthenticationServer
    filter: is_ipv4(to_string(.Event.EventData.AuthenticationServer) ?? "") || is_ipv6(to_string(.Event.EventData.AuthenticationServer) ?? "")
  - set:
      destination.domain: Event.EventData.AuthenticationServer
    filter: '!exists(.destination.ip) && .Event.EventData.AuthenticationServer != "-"'
  - set:
      action.outcome:
        value: success
    filter: .Event.System.Keywords == "0x8020000000000000"
  - set:
      action.outcome:
        value: failure
    filter: .Event.System.Keywords == "0x8010000000000000"
  - set:
      event.outcome:
        value: success
    filter: .event.code == 4624
  - set:
      event.outcome:
        value: failure
    filter: .event.code == 4625
  - set:
      rule.name: Event.EventData.RuleName
  - set:
      action.target:
        value: network-traffic
    filter: exists(.source) && exists(.destination) && exists(.action)
  - set:
      action.target:
        value: registry
    filter: exists(.registry) && exists(.action)
  - set:
      destination.ip: Event.EventData.DestinationIp
  - set:
      destination.ip: Event.EventData.DestAddress
    filter: '!exists(.destination.ip)'
  - set:
      destination.port: Event.EventData.DestinationPort
  - set:
      destination.port: Event.EventData.DestPort
    filter: '!exists(.destination.port)'
  - set:
      destination.domain: Event.EventData.DestinationHostname
  - set:
      destination.domain: url.domain
    filter: exists(.url.domain) && !exists(.destination.domain)
  - set:
      destination.address: Event.EventData.DestinationAddress
  - set:
      destination.address: Event.EventData.DestAddress
    filter: '!exists(.destination.address)'
  - set:
      destination.address: url.domain
    filter: exists(.url.domain) && !exists(.destination.address)
  - delete:
      - Event
      - parsed_hashes_kv
      - parsed_hashes_kv_2
      - parse_url

timeline:
  - message: "Hostname: {host.name} - Source: {event.provider} - EventID: {action.id}"
    conditions: []

  - message: "Hostname: {host.name} - {action.name}"
    conditions:
      - field: action.name

  # ── Security - Logon/Logoff ───────────────────────────────────────────────
  - id: evtx-4624
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} logged on to {host.name} (LogonType {action.properties.LogonType})"
    conditions:
      - field: action.id
        value: 4624
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4624-2
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} logged on to {host.name} from IP {source.ip} (LogonType {action.properties.LogonType})"
    conditions:
      - field: action.id
        value: 4624
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: source.ip

  - id: evtx-4625
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} failed to log on to {host.name} (LogonType {action.properties.LogonType})"
    conditions:
      - field: action.id
        value: 4625
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4625-2
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} failed to log on to {host.name} from IP {source.ip} (LogonType {action.properties.LogonType})"
    conditions:
      - field: action.id
        value: 4625
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: source.ip

  - id: evtx-4634
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} logged off from {host.name}"
    conditions:
      - field: action.id
        value: 4634
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4648
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} attempted to log on to {action.properties.TargetServerName} using explicit credentials"
    conditions:
      - field: action.id
        value: 4648
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4648-2
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} attempted to log on to {host.name} using explicit credentials"
    conditions:
      - field: action.id
        value: 4648
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: action.properties.TargetServerName
        value: localhost

  # ── Security - Registry ───────────────────────────────────────────────────
  - id: evtx-4657
    message: "{user.domain}\\\\{user.name} modified the value {action.properties.ObjectValueName} of the registry key {action.properties.ObjectName} to {action.properties.NewValue} on {host.name}"
    conditions:
      - field: action.id
        value: 4657
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  # ── Security - Object Access ──────────────────────────────────────────────
  - id: evtx-4662
    message: "{user.domain}\\\\{user.name} accessed the object {action.properties.ObjectName} on {host.name}"
    conditions:
      - field: action.id
        value: 4662
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  # ── Security - Special Logon ──────────────────────────────────────────────
  - id: evtx-4672
    message: "{user.domain}\\\\{user.name} logged on to {host.name} with special privileges"
    conditions:
      - field: action.id
        value: 4672
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  # ── Security - Process ────────────────────────────────────────────────────
  - id: evtx-4688
    message: "{user.domain}\\\\{user.name} executed {process.command_line} on {host.name}"
    conditions:
      - field: action.id
        value: 4688
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4689
    message: "Process {process.name} exited. It was executed by {user.domain}\\\\{user.name} on {host.name}"
    conditions:
      - field: action.id
        value: 4689
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  # ── Security - Account Management ────────────────────────────────────────
  - id: evtx-4720
    message: "{user.domain}\\\\{user.name} created account {action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} on {host.name}"
    conditions:
      - field: action.id
        value: 4720
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4722
    message: "{user.domain}\\\\{user.name} enabled account {action.properties.TargetDomainName}\\\\{action.properties.TargetUserName}"
    conditions:
      - field: action.id
        value: 4722
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4723
    message: "{user.domain}\\\\{user.name} changed their password on {host.name}"
    conditions:
      - field: action.id
        value: 4723
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: action.outcome
        value: success

  - id: evtx-4723-2
    message: "{user.domain}\\\\{user.name} failed to change their password on {host.name}"
    conditions:
      - field: action.id
        value: 4723
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: action.outcome
        value: failure

  - id: evtx-4725
    message: "{user.domain}\\\\{user.name} disabled account {action.properties.TargetDomainName}\\\\{action.properties.TargetUserName}"
    conditions:
      - field: action.id
        value: 4725
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4726
    message: "{user.domain}\\\\{user.name} deleted account {action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} on {host.name}"
    conditions:
      - field: action.id
        value: 4726
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4727
    message: "{user.domain}\\\\{user.name} created group {action.properties.TargetDomainName}\\\\{action.properties.TargetUserName}"
    conditions:
      - field: action.id
        value: 4727
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  # ── Security - Kerberos ───────────────────────────────────────────────────
  - id: evtx-4768
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} failed to authenticate from {source.ip} (Error Code: {action.properties.Status})"
    conditions:
      - field: action.id
        value: 4768
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4768-2
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} successfully authenticated from {source.ip}"
    conditions:
      - field: action.id
        value: 4768
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: action.outcome
        value: success

  - id: evtx-4769
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} was denied a service ticket for {action.properties.ServiceName} from {source.ip} (Error Code: {action.properties.Status})"
    conditions:
      - field: action.id
        value: 4769
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4769-2
    message: "{action.properties.TargetDomainName}\\\\{action.properties.TargetUserName} was granted a service ticket for {action.properties.ServiceName} from {source.ip}"
    conditions:
      - field: action.id
        value: 4769
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing
      - field: action.outcome
        value: success

  - id: evtx-4771
    message: "{action.properties.TargetUserName} failed to authenticate from {source.ip}"
    conditions:
      - field: action.id
        value: 4771
      - field: event.provider
        value: Microsoft-Windows-Security-Auditing

  - id: evtx-4776
    message: "{action.properties.TargetUserName} failed to authenticate on {action.properties.Workstation} (Reason: {action.properties.Status})"
