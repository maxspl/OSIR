metadata:
  version: "1.0"
  id: routes
  author: Typ
  description: Windows Routes

transformation:
  - custom: |2-
      if !exists(.event) || !exists(.event.original) {
          .event.original = encode_json!(.)
      }
  - set:
      event.provider:
        value: Windows routes
      network.type:
        value: ipv4
      network.protocol:
        value: ip
  - custom: |2-
      rec_type = null

      if exists(.type) {
          rec_type = to_string!(del(.type))
          .action.properties.type = rec_type
      }

      if exists(.index) {
          idx_raw = to_string!(del(.index))
          idx_int = parse_int(idx_raw) ?? null

          if idx_int != null {
              .action.properties.interface_index = idx_int
          } else {
              .action.properties.interface_index = idx_raw
          }
      }

      if rec_type == "ipv6_route" {
          .network.type = "ipv6"

          if exists(.destination) {
              dest6 = to_string!(del(.destination))
              .action.properties.destination = dest6
              if dest6 == "On-link" {
                  .action.properties.on_link = true
              }
          }

          if exists(.gateway) {
              gw6 = to_string!(del(.gateway))
              if gw6 != "" {
                  .action.properties.gateway = gw6
              }
          }

          if exists(.interface_index) {
              idx6_raw = to_string!(del(.interface_index))
              idx6_int = parse_int(idx6_raw) ?? null
              if idx6_int != null {
                  .action.properties.interface_index = idx6_int
              } else {
                  .action.properties.interface_index = idx6_raw
              }
          }

          if exists(.metric) {
              metric6_raw = to_string!(del(.metric))
              metric6_int = parse_int(metric6_raw) ?? null
              if metric6_int != null {
                  .action.properties.metric = metric6_int
              } else {
                  .action.properties.metric = metric6_raw
              }
          }
      }

      if rec_type == "route_interface" {
          if exists(.name) {
              iface_name = to_string!(del(.name))
              .action.properties.interface_name = iface_name
              .observer.name = iface_name
          }

          if exists(.mac_address) {
              mac_raw = to_string!(del(.mac_address))
              .action.properties.interface_mac_raw = mac_raw

              mac_norm = downcase(replace(mac_raw, " ", ":"))
              .action.properties.interface_mac = mac_norm

              .host.mac = [mac_norm]
          }
      }

      if rec_type == "ipv4_route" {
          if exists(.destination) {
              dest = to_string!(del(.destination))
              .action.properties.destination = dest
          }

          if exists(.netmask) {
              mask = to_string!(del(.netmask))
              .action.properties.netmask = mask
          }

          if exists(.gateway) {
              gw_raw = to_string!(del(.gateway))

              if gw_raw == "On-link" {
                  .action.properties.gateway = gw_raw
                  .action.properties.on_link = true
              } else {
                  .network.next_hop = gw_raw
                  .action.properties.gateway = gw_raw
              }
          }

          if exists(.interface) {
              iface_ip = to_string!(del(.interface))
              .action.properties.interface_ip = iface_ip

              .host.ip = [iface_ip]
          }

          if exists(.metric) {
              metric_raw = to_string!(del(.metric))
              metric_int = parse_int(metric_raw) ?? null

              if metric_int != null {
                  .action.properties.metric = metric_int
              } else {
                  .action.properties.metric = metric_raw
              }
          }
      }
