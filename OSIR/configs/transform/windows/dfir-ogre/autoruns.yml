metadata:
  version: "1.0"
  id: autoruns
  author: Typ
  description: Persistence artifacts (dfir-ogre autoruns.csv harvest JSONL) → ECS

transformation:
  - set:
      event.original: encode_json!(.)

  - set:
      event.provider:
        value: "Windows Autoruns (dfir-ogre)"

  # entry_location, entry_name, entry, category, profile, image_path,
  # launch_string, hashes, time, ...
  - set:
      registry.path: entry_location
      process.executable: image_path
      process.command_line: launch_string
      file.path: image_path
      file.hash.md5: md5
      file.hash.sha1: sha1
      file.hash.sha256: sha256
      action.properties.pe_sha1: pe_sha1
      action.properties.pe_sha256: pe_sha256
      action.properties.entry_name: entry_name
      action.properties.entry: entry
      action.properties.category: category
      action.properties.profile: profile
      action.properties.description: description
      action.properties.company: company
      action.properties.signer: signer
      action.properties.version: version
      action.properties.imp: imp
      timestamp:
        source: time
        operation: parse_timestamp
        parameters:
          format: "%Y-%m-%dT%H:%M:%S%.f%z"
    filter: exists(.entry_location)

  - delete:
      - entry_location
      - entry_name
      - entry
      - category
      - profile
      - description
      - company
      - signer
      - version
      - launch_string
      - md5
      - sha1
      - sha256
      - pe_sha1
      - pe_sha256
      - imp
      - time
      - ogre_md

timeline:
  - id: autoruns-entry
    message: "Autoruns entry {process.executable} registered at {registry.path}"
    conditions:
      - field: registry.path
        exists: true

relationships:
  - id: autoruns-entry
    source: registry.path
    target: process.executable
    type: launches
